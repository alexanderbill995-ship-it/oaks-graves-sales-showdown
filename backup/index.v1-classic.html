    strongBehaviors:['Warm, genuinely engaged, but redirects with a plan','Uses her story as a bridge back to the roof','Sets a clear agenda with time','Offers to hear the rest "after I\'ve looked at the roof"','Keeps the relationship — she is going to buy from someone she likes'],
    weakBehaviors:['Interrupting rudely or visibly checking the time','Letting it run another 45 minutes','Being cold or transactional','Skipping the inspection to save time','Never asking for the business'],
    approach:'"I love that story — and I want to hear about the last roofer because that matters for this. Let me do this: I\'ll hop up on the roof for twenty minutes, then we\'ll sit down and you can tell me everything while I show you what I found. Deal?"'
  } },
{ id:'cc-200', category:'Curveball Customer', value:200, scope:['Siding'], difficulty:2, persona:'Busy executive',
  situation:'You arrive on time. The homeowner opens the door with a phone in his hand and a laptop under his arm.',
  homeowner:'I\'m slammed. I\'ve got a call at six. Can you just give me the price? I only have twenty minutes.',

    strongBehaviors:['Respects the twenty minutes and commits to it','Asks who else is involved in the decision — brings the wife into the conversation','Uses the time for a focused inspection and discovery, not a price guess','Proposes a specific, realistic path to a decision (finish now with both, or a scheduled return)','Confident, efficient, not flustered'],
    weakBehaviors:['Giving a ballpark from the driveway','Ignoring the wife entirely','Trying to cram a full presentation into twenty minutes','Sounding resentful of the time limit','Leaving with no plan'],
    approach:'"Twenty minutes works — I\'ll use them well. Two questions first: who else is weighing in on this, and would she want to see what I find? If she\'s home, let\'s get her down here so I only have to do this once." Then propose the decision path.'
  } },
{ id:'cc-300', category:'Curveball Customer', value:300, scope:['Roofing'], difficulty:3, persona:'DIY homeowner',
  situation:'The homeowner has a well-equipped garage and rebuilt his own deck last summer. He has looked at your roof proposal.',
  homeowner:'I can get shingles cheaper myself, and my buddy and I can do this in a weekend. I redid my whole deck — how different can it be? Would you just do the tear-off part?',
  hiddenContext:'His roof has two layers, a steep rear pitch, and a chimney that needs flashing work. His deck project also took four weekends, not one. He is proud of his skills and does not want to be talked down to.',
  followUps:['I redid my deck. How different is it really?','Would you just do the tear-off and let me handle the rest?'],
  coachKey:{
    objective:'Respect his skills, be honest about what makes this roof different from a deck, and help him decide what he wants to own — the labor or the outcome.',
    strongBehaviors:['Compliments the deck sincerely and treats him as capable','Asks about the deck: how long it took, what surprised him','Points to what is specific to this roof: two layers, steep pitch, chimney flashing, safety, warranty','Answers the partial-work question honestly per company practice','Asks what he actually wants — to do the work, or have it done right and warranted'],
    weakBehaviors:['Talking down to him or implying he cannot do it','Scare tactics about falling','Dodging the tear-off question','Getting technical to intimidate','No close'],
    approach:'"The deck looks great. How long did it actually take?" Listen. "Here\'s what\'s different on this roof specifically…" Be honest about partial work. Then: "So the question is whether you want to own the project or own the result. Which is it?"'
  } },
{ id:'cc-400', category:'Curveball Customer', value:400, scope:['Roofing'], difficulty:4, persona:'Homeowner caught in a bidding war',
  situation:'Mid-presentation, the homeowner\'s phone rings. He steps out for three minutes and comes back looking pleased.',
  homeowner:'Sorry about that. That was actually the other roofer. He just dropped his price by two thousand dollars. So... where were we?',
  hiddenContext:'The other company called because they had not heard back — the price drop was unprompted. The homeowner now believes all roofing prices are inflated and negotiable. He is testing whether you will drop too.',
  followUps:['He seems hungrier for the job, honestly.','Why would he drop it two grand that fast if he wasn\'t padding it to begin with?'],
  coachKey:{
    objective:'Stay composed, refuse to enter a bidding war, and help the homeowner think about what an unprompted price drop tells him — without insulting the competitor.',
    strongBehaviors:['Stays calm and unbothered','Asks a genuine question: what changed in the scope for the price to drop?','Explains how your price is built and why it is the same before and after a phone call','Reframes "hungrier" honestly','Returns to the homeowner\'s priorities and asks for the decision'],
    weakBehaviors:['Immediately matching the drop','Saying the competitor is a crook','Visibly rattled','Arguing about whether the other price was padded','Losing the thread of the presentation'],
    approach:'"Good news for you. Quick question: did the scope change, or just the number?" Pause. "Here\'s how our number is built — it\'s the same whether you call me tomorrow or not." Reframe, return to his priorities, and ask for the decision.'
  } },
{ id:'cc-500', category:'Curveball Customer', value:500, scope:['Roofing'], difficulty:5, persona:'Grieving homeowner',
  situation:'The homeowner lost her husband last year. The roof leaked into the attic where his belongings are stored, which she mentioned quietly during the walk-through. She has been making every household decision alone for the first time. Your presentation went well.',
  homeowner:'I need to talk to my brother first. He knows construction. He\'ll know if this is right.',

  followUps:['He\'ll know if you\'re ripping me off. No offense.','I just... don\'t want to make a mistake. Not on this.'],
  coachKey:{
    objective:'Recognize that this is about not deciding alone, not about construction expertise. Offer real reassurance and real involvement for the brother — without pressure and without exploiting her situation.',
    strongBehaviors:['Warm, unhurried, genuinely kind','Welcomes the brother — offers to speak with him, send him the inspection photos, answer his questions','Gently asks what would make her feel confident about the decision','Reconnects, carefully, to the attic and what is stored there','Never uses grief as leverage — no urgency tactics','Proposes a concrete, comfortable next step (a call with the brother at a set time)'],
    weakBehaviors:['Trying to talk her out of involving her brother','Treating it as a stall','Pressuring for a same-day decision','Ignoring the emotional context','Being cold or transactional'],
    approach:'"Of course — and I\'d be glad to talk with him myself. Would it help if I sent him the photos and walked him through what I found? Can I ask what would make you feel like this is the right call?" Listen. Acknowledge the attic gently. Propose a specific call with her brother and a time to follow up.'
  } },

/* ===================== FOLLOW-UP / REHASH ===================== */
{ id:'fr-100', category:'Follow-Up / Rehash', value:100, scope:['Roofing'], difficulty:1, persona:'Busy homeowner',

{ id:'fr-200', category:'Follow-Up / Rehash', value:200, scope:['Siding'], difficulty:2, persona:'Price-sensitive returning homeowner',

{ id:'fr-300', category:'Follow-Up / Rehash', value:300, scope:['Roofing'], difficulty:3, persona:'Burned-out homeowner',
  situation:'IN-PERSON REHASH. You quoted a roof last spring. The homeowners never chose anyone. A windstorm since then lifted more shingles. You stop by.',

{ id:'fr-400', category:'Follow-Up / Rehash', value:400, scope:['Windows'], difficulty:4, persona:'Homeowner burned by a competitor',

{ id:'fr-500', category:'Follow-Up / Rehash', value:500, scope:['Siding','Roofing'], difficulty:5, persona:'Repeat customer with a grievance',

/* ===================== CONTROL THE APPOINTMENT ===================== */
{ id:'ca-100', category:'Control the Appointment', value:100, scope:['Roofing'], difficulty:1, persona:'Experienced homeowner',
  situation:'You have just sat down and started to explain how the appointment will go.',
  homeowner:'I don\'t need the whole presentation. I\'ve done this before. Just look at the roof and tell me what it costs.',

  followUps:['I\'ve done this before. I know what I want.','How long is this going to take?'],
  coachKey:{
    objective:'Agree to a streamlined appointment while keeping the parts that matter — inspection, a few discovery questions, and a clear presentation of findings.',

    weakBehaviors:['Insisting on the full presentation','Skipping discovery entirely','Going up on the roof with no idea what he cares about','Rambling','No close'],

  } },
{ id:'ca-200', category:'Control the Appointment', value:200, scope:['Windows'], difficulty:2, persona:'Gatekeeper spouse',
  situation:'You have finished the inspection and are about to present. The wife has been attentive; the husband is not home.',

    weakBehaviors:['Leaving the quote and leaving','Dismissing her as not the decision maker','Pressuring her to decide alone','Refusing to leave anything (controlling)','No scheduled follow-up'],

{ id:'ca-300', category:'Control the Appointment', value:300, scope:['Siding'], difficulty:3, persona:'Distracted parent',

    weakBehaviors:['Presenting the whole thing over the noise','Visible frustration','Leaving the information and leaving','Ignoring the kids\' room connection','No next step'],

{ id:'ca-400', category:'Control the Appointment', value:400, scope:['Roofing'], difficulty:4, persona:'Quote collector',
  situation:'You have barely started. Before the inspection, the homeowner says:',
  homeowner:'Just leave the quote. If we like it, we\'ll call you. We\'ve had four companies out already and we just want to compare numbers.',
  hiddenContext:'Four quotes range wildly, and the homeowners cannot tell why. They are frustrated and confused, not disinterested. What they need is someone to help them understand what they are looking at. That is the rep\'s opening.',

  coachKey:{

{ id:'ca-500', category:'Control the Appointment', value:500, scope:['Roofing','Siding'], difficulty:5, persona:'Misaligned spouse',

    Timer.stop(true);

    S.view = S.currentSession ? (m ? phaseView(m.phase) : (S.view === 'recap' ? 'wheel' : (SESSION_VIEWS.includes(S.view) ? (S.view === 'result' || S.view === 'recap' ? 'wheel' : S.view) : S.view))) : 'home';
    if (S.currentSession && !m && ['battle', 'judge', 'sudden', 'result'].includes(S.view)) S.view = 'wheel';
    save(); render(); toast('Undid: ' + u.label, 'gold');
  } catch (e) { toast('Undo failed.', 'err'); }
}

/* =====================================================================
   SECTION 10 — SESSION MODEL
   ===================================================================== */
function newStanding() { return { appearances: 0, matchWins: 0, matchLosses: 0, roundWins: 0, totalPoints: 0, totalRubricPoints: 0, rubricRounds: 0, streak: 0, lastAppearance: 0, lastOpponent: null }; }
function sessStat(id) { const c = S.currentSession; if (!c.standings[id]) c.standings[id] = newStanding(); return c.standings[id]; }
function sessionParticipants() { const c = S.currentSession; return c ? c.participants.map(getRep).filter(r => r && r.active) : []; }

function createSession(opts) {
  const c = {
    id: uid('sess'), name: opts.name || 'Friday Sales Showdown', startedAt: Date.now(), participants: opts.participants.slice(),
    format: opts.format, wheelMode: opts.wheelMode, timerSeconds: opts.timerSeconds, autoFollowUp: !!opts.autoFollowUp,
    board: null, boardsGenerated: 0, matchups: [], standings: {}, pairCounts: {}, currentMatch: null, roundHistory: [], repNames: {},
    usedScenarioIds: [], wheel: { c1: null, c2: null }, categoryChoice: opts.categories || null
  };
  S.currentSession = c;
  c.participants.forEach(id => { const r = getRep(id); if (r) c.repNames[id] = r.name; sessStat(id); });
  generateBoard(opts.categories);
  S.undoStack = [];
  save();
}

/* Board: 6 categories × 5 values. Scenario assigned per tile at generation so refreshes are stable. */
function generateBoard(manualCategories) {
  const c = S.currentSession;
  let cats = (manualCategories && manualCategories.length === 6) ? manualCategories.slice() : null;
  if (!cats) {
    const playable = allCategories().filter(categoryIsPlayable);
    cats = shuffle(playable).slice(0, 6);
    while (cats.length < 6) cats.push(pick(allCategories())); // degenerate bank — still render 6 columns
  }
  const used = new Set(c.usedScenarioIds);
  const tiles = [];
  cats.forEach((cat, ci) => {
    TILE_VALUES.forEach(v => {
      const sc = pickScenarioFor(cat, v, used);
      if (sc) used.add(sc.id);
      tiles.push({ id: 't-' + ci + '-' + v, category: cat, value: v, scenarioId: sc ? sc.id : null, used: false, doubleDown: false, winnerId: null, skipped: false });
    });
  });
  // Two hidden Double Down tiles, weighted away from 100s.
  const ddPool = shuffle(tiles.filter(t => t.scenarioId && t.value >= 200));
  ddPool.slice(0, 2).forEach(t => t.doubleDown = true);
  c.board = { categories: cats, tiles, number: (c.boardsGenerated || 0) + 1 };
  c.boardsGenerated = (c.boardsGenerated || 0) + 1;
  save();
}
function pickScenarioFor(cat, value, used) {
  const pool = enabledScenarios().filter(s => s.category === cat);
  const fresh = pool.filter(s => !used.has(s.id));
  const byVal = (list, v) => list.filter(s => s.value === v);
  let cands = byVal(fresh, value);
  if (!cands.length) { // nearest value among fresh
    const order = TILE_VALUES.slice().sort((a, b) => Math.abs(a - value) - Math.abs(b - value));
    for (const v of order) { cands = byVal(fresh, v); if (cands.length) break; }
  }
  if (!cands.length) cands = byVal(pool, value);          // allow repeats if the bank is exhausted
  if (!cands.length) cands = pool;
  return cands.length ? pick(cands) : null;
}
function boardRemaining() { const c = S.currentSession; return c && c.board ? c.board.tiles.filter(t => !t.used && t.scenarioId).length : 0; }

/* Fair rotation. Never predetermined visually — selection is decided first, then the wheel animates to it. */
function pickContender(excludeIds = [], partnerId = null) {
  const c = S.currentSession;
  const pool = sessionParticipants().filter(r => !excludeIds.includes(r.id));
  if (!pool.length) return null;
  if (c.wheelMode === 'random') return pick(pool);
  const scored = pool.map(r => {
    const st = c.standings[r.id] || newStanding();
    const pair = partnerId ? (c.pairCounts[pairKey(r.id, partnerId)] || 0) : 0;
    const repeat = partnerId && (c.standings[partnerId] || {}).lastOpponent === r.id ? 1 : 0;
    // appearances dominate; immediate repeat and pairing frequency break ties
    return { r, key: st.appearances * 10 + repeat * 5 + pair * 3 };
  });
  scored.sort((a, b) => a.key - b.key);
  const best = scored[0].key;
  return pick(scored.filter(s => s.key === best)).r;
}

/* Matchup helpers for the intro card */
function seriesToday(a, b) {
  const c = S.currentSession; let wa = 0, wb = 0;
  c.matchups.forEach(m => { if ((m.repAId === a && m.repBId === b) || (m.repAId === b && m.repBId === a)) { if (m.winnerId === a) wa++; else if (m.winnerId === b) wb++; } });
  return { wa, wb, n: wa + wb };
}
function strongestCategory(repId) {
  const rows = S.coachingHistory.filter(h => h.repAId === repId || h.repBId === repId);
  const agg = {};
  rows.forEach(h => { const sc = h.repAId === repId ? h.repAScore : h.repBScore; if (!isNum(sc)) return; (agg[h.category] = agg[h.category] || { s: 0, n: 0 }); agg[h.category].s += sc; agg[h.category].n++; });
  let best = null;
  Object.entries(agg).forEach(([cat, v]) => { if (v.n >= 2) { const a = v.s / v.n; if (!best || a > best.avg) best = { cat, avg: a }; } });
  return best;
}
function categoryAverages(repId) {
  const agg = {};
  S.coachingHistory.forEach(h => {
    if (h.repAId !== repId && h.repBId !== repId) return;
    const sc = h.repAId === repId ? h.repAScore : h.repBScore; if (!isNum(sc)) return;
    (agg[h.category] = agg[h.category] || { s: 0, n: 0 }); agg[h.category].s += sc; agg[h.category].n++;
  });
  return Object.entries(agg).map(([cat, v]) => ({ cat, avg: v.s / v.n, n: v.n })).sort((a, b) => b.avg - a.avg);
}

const Wheel = {
  angle: 0, spinning: false, slices: [], canvas: null, raf: null, lastIdx: -1,
  palette: ['#1f8a4e', '#173a73', '#c67a1e', '#1f4f8a', '#26a35f', '#8a4a1a', '#24336b', '#2f9e6a', '#a35f1c', '#1b5c9c'],
  setSlices(reps) { this.slices = reps; this.draw(); },
  draw() {
    const c = this.canvas; if (!c) return;
    const ctx = c.getContext('2d'); const W = c.width, R = W / 2; const n = this.slices.length;
    ctx.clearRect(0, 0, W, W);
    if (!n) { ctx.fillStyle = '#132449'; ctx.beginPath(); ctx.arc(R, R, R - 4, 0, 6.283); ctx.fill(); return; }
    const step = 6.283185 / n;
    for (let i = 0; i < n; i++) {
      const a0 = this.angle + i * step, a1 = a0 + step;
      ctx.beginPath(); ctx.moveTo(R, R); ctx.arc(R, R, R - 4, a0, a1); ctx.closePath();
      const g = ctx.createRadialGradient(R, R, R * 0.2, R, R, R);
      const base = this.palette[i % this.palette.length]; g.addColorStop(0, shade(base, 18)); g.addColorStop(1, shade(base, -22));
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 3; ctx.stroke();
      // label
      const mid = a0 + step / 2; const flip = Math.cos(mid) < 0; // keep left-half labels right-side-up
      ctx.save(); ctx.translate(R, R); ctx.rotate(mid + (flip ? Math.PI : 0)); ctx.textAlign = flip ? 'left' : 'right'; ctx.textBaseline = 'middle';
      const name = this.slices[i].name;
      let label = n <= 14 ? firstName(name) : (n <= 26 ? firstName(name) : initials(name));
      let size = n <= 8 ? W * 0.075 : n <= 14 ? W * 0.055 : n <= 26 ? W * 0.036 : W * 0.03;
      ctx.font = `900 ${size}px "Arial Black","Segoe UI Black",Arial,sans-serif`;
      const maxW = R * 0.62; while (ctx.measureText(label.toUpperCase()).width > maxW && size > 10) { size -= 2; ctx.font = `900 ${size}px "Arial Black","Segoe UI Black",Arial,sans-serif`; }
      const tx = flip ? -(R - R * 0.09) : (R - R * 0.09);
      ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillText(label.toUpperCase(), tx + 2, 2);
      ctx.fillStyle = '#fff'; ctx.fillText(label.toUpperCase(), tx, 0);
      ctx.restore();
    }
    // hub
    ctx.beginPath(); ctx.arc(R, R, R * 0.26, 0, 6.283); ctx.fillStyle = '#0b1730'; ctx.fill();
    ctx.strokeStyle = 'rgba(244,198,90,.8)'; ctx.lineWidth = 4; ctx.stroke();
  },
  indexAtPointer() {
    const n = this.slices.length; if (!n) return -1; const step = 6.283185 / n;
    let rel = (-Math.PI / 2 - this.angle) % 6.283185; if (rel < 0) rel += 6.283185;
    return Math.floor(rel / step) % n;
  },
  spinTo(targetIdx, done) {
    const n = this.slices.length; const step = 6.283185 / n;
    const offset = (0.18 + Math.random() * 0.64) * step;
    const want = -Math.PI / 2 - (targetIdx * step + offset); // angle such that pointer is inside target slice
    let delta = (want - this.angle) % 6.283185; if (delta < 0) delta += 6.283185;
    const turns = reducedMotion() ? 1 : 4 + rand(3);
    const total = delta + turns * 6.283185;
    const start = this.angle, t0 = performance.now(), dur = reducedMotion() ? 900 : 4200 + rand(900);
    this.spinning = true; this.lastIdx = this.indexAtPointer();
    const ease = t => 1 - Math.pow(1 - t, 3.2);
    const tick = now => {
      const p = Math.min(1, (now - t0) / dur); this.angle = start + total * ease(p); this.draw();
      const idx = this.indexAtPointer(); if (idx !== this.lastIdx) { this.lastIdx = idx; Sound.tick(); }
      if (p < 1) this.raf = requestAnimationFrame(tick); else { this.spinning = false; this.angle %= 6.283185; this.draw(); done(); }
    };
    this.raf = requestAnimationFrame(tick);
  }
};
function shade(hex, pct) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = v => Math.max(0, Math.min(255, Math.round(v + (pct / 100) * 255)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

async function spinWheel() {

  if (!pool.length) return;
  const chosen = stage === 1 ? pickContender([]) : pickContender([w.c1], w.c1);

const Timer = {
  total: 45, remaining: 45, running: false, iv: null, mode: 'response', stopwatch: false, elapsed: 0, warned5: false, warned10: false,
  configure(sec) { this.stop(true); this.total = sec || 0; this.stopwatch = !sec; this.remaining = this.total; this.elapsed = 0; this.mode = 'response'; this.warned5 = this.warned10 = false; this.render(); },
  reset() { this.configure(this.total || (S.currentSession ? S.currentSession.timerSeconds : 45)); },
  prep() { const p = S.settings.prepSeconds || 10; this.stop(true); this.mode = 'prep'; this.remaining = p; this.warned5 = this.warned10 = true; this.start(); },
  start() {
    if (this.running) return; this.running = true; Sound.ensure(); let last = performance.now();
    this.iv = setInterval(() => {
      const now = performance.now(); const dt = (now - last) / 1000; last = now;
      if (this.stopwatch && this.mode === 'response') { this.elapsed += dt; this.render(); return; }
      const prev = this.remaining; this.remaining = Math.max(0, this.remaining - dt);
      if (this.mode === 'response') {
        if (!this.warned10 && this.remaining <= 10 && this.total > 15) { this.warned10 = true; Sound.warn(); }
        if (!this.warned5 && this.remaining <= 5) { this.warned5 = true; Sound.crit(); }
        if (Math.ceil(prev) !== Math.ceil(this.remaining) && this.remaining <= 5 && this.remaining > 0) Sound.tick();
        // automatic follow-up objection at the halfway mark
        const c = S.currentSession, m = c && c.currentMatch;
        if (m && m.phase === 'roleplay' && c.autoFollowUp && this.remaining <= this.total / 2 && !(m.autoFired || []).includes(m.responderIndex)) { m.autoFired = (m.autoFired || []).concat([m.responderIndex]); save(); triggerPushback(true); }
      } else if (this.mode === 'prep') {
        if (Math.ceil(prev) !== Math.ceil(this.remaining)) { Sound.countdown(); showCountdownNumber(Math.ceil(this.remaining)); }
      }
      if (this.remaining <= 0) {
        if (this.mode === 'prep') { this.stop(true); this.mode = 'response'; this.remaining = this.total; this.warned5 = this.warned10 = false; this.render(); if (this.total) this.start(); return; }
        this.stop(true); Sound.buzzer(); this.render(); return;
      }
      this.render();
    }, 100);
    this.render();
  },
  pause() { this.stop(); },
  stop(silent) { this.running = false; if (this.iv) { clearInterval(this.iv); this.iv = null; } if (!silent) this.render(); },
  toggle() { if (this.running) this.pause(); else { if (!this.stopwatch && this.remaining <= 0 && this.mode === 'response') this.reset(); this.start(); } },
  add(sec) { if (this.stopwatch) return; this.remaining += sec; if (this.remaining > 5) this.warned5 = false; if (this.remaining > 10) this.warned10 = false; this.render(); },
  skip() { this.stop(true); this.mode = 'response'; this.remaining = 0; this.render(); },
  render() {
    const card = $('#timerCard'); if (!card) return;
    const time = $('#timerTime'), bar = $('#timerBar i'), btn = $('#timerToggle'), lbl = $('#timerLbl');
    card.classList.remove('warn', 'crit', 'done', 'prep');
    if (this.mode === 'prep') { card.classList.add('prep'); lbl.textContent = 'Prep — get ready'; time.textContent = fmtClock(this.remaining); if (bar) bar.style.width = (this.remaining / (S.settings.prepSeconds || 10) * 100) + '%'; }
    else if (this.stopwatch) { lbl.textContent = 'No timer — elapsed'; time.textContent = fmtClock(this.elapsed); if (bar) bar.style.width = '100%'; }
    else {
      lbl.textContent = this.running ? 'Response time' : (this.remaining <= 0 ? 'Time' : 'Response timer');
      time.textContent = fmtClock(this.remaining);
      if (bar) bar.style.width = (this.total ? this.remaining / this.total * 100 : 0) + '%';
      if (this.remaining <= 0) card.classList.add('done'); else if (this.remaining <= 5) card.classList.add('crit'); else if (this.remaining <= 10 && this.total > 15) card.classList.add('warn');
    }
    if (btn) btn.textContent = this.running ? '❚❚ Pause' : '▶ Start';
  }
};

  const scoreA = compA ? scoreTotal(m.currentScores.A) : null, scoreB = compB ? scoreTotal(m.currentScores.B) : null;

    repAScore: scoreA, repBScore: scoreB, winner: winnerId ? repName(winnerId) : 'Tie', winnerId: winnerId || null,

function pickFile(accept, cb) {

  inp.addEventListener('change', () => { const f = inp.files[0]; inp.remove(); if (!f) return; const r = new FileReader(); r.onload = () => cb(r.result, f.name); r.onerror = () => toast('Could not read the file.', 'err'); r.readAsText(f); });

async function importBankText(text) {
  let data; try { data = JSON.parse(text); } catch (e) { toast('Import rejected: not valid JSON.', 'err'); return; }
  let scenarios = Array.isArray(data) ? data : (data && Array.isArray(data.customScenarios) ? data.customScenarios : null);
  if (!scenarios) { toast('Import rejected: no scenario list found.', 'err'); return; }
  const valid = scenarios.filter(validScenario).map(normalizeScenario);
  if (!valid.length) { toast('Import rejected: no valid scenarios (need id, category, value, homeowner).', 'err'); return; }
  const disabled = data && Array.isArray(data.disabledScenarioIds) ? data.disabledScenarioIds.filter(x => typeof x === 'string') : null;
  const ok = await confirmDialog({ title: 'Import question bank', message: `Found <b>${valid.length}</b> valid custom scenario${valid.length === 1 ? '' : 's'}${scenarios.length !== valid.length ? ` (${scenarios.length - valid.length} skipped as invalid)` : ''}${disabled ? ` and ${disabled.length} disabled-scenario flags` : ''}. Matching IDs are updated, new ones added.`, okLabel: 'Import' });
  if (!ok) return;
  valid.forEach(sc => { const i = S.customScenarios.findIndex(x => x.id === sc.id); if (i >= 0) S.customScenarios[i] = sc; else S.customScenarios.push(sc); });
  if (disabled) S.disabledScenarioIds = Array.from(new Set(disabled));
  save(); render(); toast(`Imported ${valid.length} scenario${valid.length === 1 ? '' : 's'}.`);
}

function sessionRecap() {
  const c = S.currentSession; const rows = standingsRows('session').filter(r => r.appearances || r.matches);
  const champion = rows[0] && rows[0].wins ? rows[0] : null;
  const byPoints = rows.slice().sort((a, b) => b.points - a.points)[0];
  const byRubric = rows.filter(r => r.rubricRounds).sort((a, b) => b.avg - a.avg)[0];
  const catCount = {}; c.roundHistory.forEach(id => { const h = S.coachingHistory.find(x => x.id === id); if (h) catCount[h.category] = (catCount[h.category] || 0) + 1; });
  const mostCat = Object.entries(catCount).sort((a, b) => b[1] - a[1])[0];
  let closest = null; c.matchups.forEach(m => { const d = Math.abs(m.repAPoints - m.repBPoints); const rd = Math.abs(m.repARoundWins - m.repBRoundWins); const k = rd * 100000 + d; if (!closest || k < closest.k) closest = { k, m }; });
  const sessionRounds = S.coachingHistory.filter(h => h.sessionId === c.id);
  const strengths = rows.map(r => { const agg = {}; sessionRounds.forEach(h => { const sc = h.repAId === r.id ? h.repAScore : h.repBId === r.id ? h.repBScore : null; if (isNum(sc)) { (agg[h.category] = agg[h.category] || { s: 0, n: 0 }); agg[h.category].s += sc; agg[h.category].n++; } }); const best = Object.entries(agg).map(([cat, v]) => ({ cat, avg: v.s / v.n })).sort((a, b) => b.avg - a.avg)[0]; return { name: r.name, best }; });
  return { rows, champion, byPoints, byRubric, mostCat, closest: closest && closest.m, strengths, rounds: sessionRounds };
}

  setSetting: a => { const [k, v] = a.split(':'); S.settings[k] = isNaN(+v) ? v : +v; save(); Sound.click(); render(); },
  setSessionTimer: a => { if (S.currentSession) { S.currentSession.timerSeconds = +a; save(); render(); toast('Session timer updated.'); } },
  beginSession: async () => {
    const parts = setupDraft.participants.filter(id => { const r = getRep(id); return r && r.active; });
    if (parts.length < 2) { toast('Select at least two participants.', 'warn'); return; }
    if (setupDraft.manualCats && setupDraft.cats.length !== 6) { toast('Choose exactly six categories, or switch to Random.', 'warn'); return; }
    if (S.currentSession) { const ok = await confirmDialog({ title: 'Replace saved session?', message: `<b>${esc(S.currentSession.name)}</b> will be closed. Its results are already in all-time stats and coaching history.`, okLabel: 'Start new session', danger: true }); if (!ok) return; S.sessionsCompleted = (S.sessionsCompleted || 0) + 1; }
    const name = ($('#sessName') || {}).value || S.settings.sessionName || 'Friday Sales Showdown';
    S.settings.sessionName = name.trim() || 'Friday Sales Showdown';
    createSession({ name: S.settings.sessionName, participants: parts, format: S.settings.format, wheelMode: S.settings.wheelMode, timerSeconds: S.settings.timerSeconds, autoFollowUp: S.settings.autoFollowUp, categories: setupDraft.manualCats ? setupDraft.cats : null });
    Sound.reveal(); go('wheel'); toast(`${S.currentSession.name} is live — spin for the first contender!`, 'gold');
  },
  spin: () => spinWheel(),
  respin: a => { const c = S.currentSession; if (!c || Wheel.spinning) return; if (a === '1') { c.wheel.c1 = null; c.wheel.c2 = null; } else c.wheel.c2 = null; save(); render(); setTimeout(spinWheel, 250); },
  manualPick: () => manualPickModal(),
  manualPickConfirm: () => { const a = $('#mpA').value, b = $('#mpB').value; if (a === b) { toast('Pick two different reps.', 'err'); return; } S.currentSession.wheel = { c1: a, c2: b }; save(); closeModal(); Sound.reveal(); showVsOverlay(getRep(a), getRep(b)).then(render); },
  clearContenders: () => { S.currentSession.wheel = { c1: null, c2: null }; save(); render(); },
  beginBattle: () => beginBattle(),
  newBoard: async () => { const c = S.currentSession; if (!c) return; if (c.currentMatch && c.currentMatch.phase !== 'board') { toast('Finish the current round first.', 'warn'); return; } const ok = boardRemaining() === 0 ? true : await confirmDialog({ title: 'Generate a new board?', message: `${boardRemaining()} unplayed tiles will be discarded. Standings and history are kept.`, okLabel: 'New board' }); if (!ok) return; pushUndo('New board'); generateBoard(null); Sound.reveal(); render(); toast('Fresh board — two new Double Down tiles are hidden.', 'gold'); },
  openTile: a => openTile(a),
  swapControl: () => { const m = S.currentSession.currentMatch; if (!m) return; m.boardControlId = m.boardControlId === m.repAId ? m.repBId : m.repAId; save(); render(); toast(`Board control → ${firstName(repName(m.boardControlId))}`); },
  swapOrder: () => { const m = S.currentSession.currentMatch; if (!m) return; m.firstResponderId = m.firstResponderId === m.repAId ? m.repBId : m.repAId; save(); render(); toast(`${firstName(repName(m.firstResponderId))} now responds first`); },
  timerToggle: () => Timer.toggle(), timerReset: () => Timer.reset(), timerAdd: () => Timer.add(15), timerSkip: () => Timer.skip(), timerPrep: () => Timer.prep(),
  pushback: () => triggerPushback(false),
  nextResponder: () => nextResponder(),
  prevResponder: () => { const m = S.currentSession.currentMatch; if (!m) return; m.responderIndex = 0; m.respondersDone = []; save(); Timer.configure(S.currentSession.timerSeconds); render(); },
  toJudge: () => toJudge(),
  backToRoleplay: () => { const m = S.currentSession.currentMatch; if (!m) return; m.phase = 'roleplay'; save(); go('battle'); },
  toggleJudgeMode: () => { S.settings.judgeMode = S.settings.judgeMode === 'quick' ? 'detailed' : 'quick'; save(); render(); },
  score: a => { const [side, i, v] = a.split(':'); setScore(side, +i, +v); },
  revealCoachKey: () => revealCoachKey(),
  awardRound: () => { const m = S.currentSession.currentMatch; if (!m) return; const tA = scoreTotal(m.currentScores.A), tB = scoreTotal(m.currentScores.B); if (!scoreComplete(m.currentScores.A) || !scoreComplete(m.currentScores.B)) { toast('Score all five dimensions for both reps first.', 'warn'); return; } if (tA === tB) startSuddenDeath(); else awardRound(tA > tB ? m.repAId : m.repBId); },
  awardTo: (a, el) => awardRound(a, { sudden: el && el.dataset.sudden === '1' }),
  manualAward: a => confirmDialog({ title: 'Award this round manually?', message: `<b>${esc(repName(a))}</b> receives the full tile value with no rubric score recorded.`, okLabel: 'Award round' }).then(ok => { if (ok) awardRound(a); }),
  suddenDeath: () => startSuddenDeath(),
  declareTie: () => confirmDialog({ title: 'Declare a true tie?', message: 'Points are split evenly and neither rep earns a round win. Board control does not change.', okLabel: 'Split points' }).then(ok => { if (ok) awardRound(null); }),
  skipQuestion: a => { if (a === 'same' || a === 'new') skipQuestion(a); else skipQuestionModal(); },
  endMatchEarly: () => endMatchEarly(), discardMatch: () => discardMatch(),
  nextMatch: () => { clearMatch(); go('wheel'); },
  rematch: () => { const c = S.currentSession; const m = c.currentMatch; if (!m) return; const a = m.repAId, b = m.repBId; clearMatch(); c.wheel = { c1: a, c2: b }; save(); if (boardRemaining() === 0) { go('wheel'); toast('Generate a new board first.', 'warn'); return; } beginBattle(); },
  returnToBoard: () => { clearMatch(); go('board'); },
  viewCoachingFor: a => { clearMatch(); coachingFilter = a; go('coaching'); },
  endSession: () => endSession(), closeSession: () => closeSession(), printRecap: () => printRecap(),
  standingsTab: a => { standingsTab = a; render(); },
  newScenario: () => scenarioForm(null), editScenario: a => { const s = S.customScenarios.find(x => x.id === a); if (s) scenarioForm(s); },
  dupScenario: a => { const s = getScenario(a); if (!s) return; const d = clone(s); d.id = uid('custom'); d.custom = true; scenarioForm(d); },
  saveScenario: () => saveScenarioFromForm(),
  deleteScenario: a => confirmDialog({ title: 'Delete custom scenario?', message: 'This cannot be undone. Rounds already recorded keep their history.', okLabel: 'Delete', danger: true }).then(ok => { if (!ok) return; S.customScenarios = S.customScenarios.filter(x => x.id !== a); save(); render(); toast('Scenario deleted.', 'warn'); }),
  toggleScenario: a => { const i = S.disabledScenarioIds.indexOf(a); if (i >= 0) S.disabledScenarioIds.splice(i, 1); else S.disabledScenarioIds.push(a); save(); render(); },
  previewScenario: a => previewScenario(a),
  resetBank: () => confirmDialog({ title: 'Reset question bank to defaults?', message: `Deletes <b>${S.customScenarios.length}</b> custom scenario${S.customScenarios.length === 1 ? '' : 's'} and re-enables all defaults.`, okLabel: 'Reset bank', danger: true }).then(ok => { if (!ok) return; S.customScenarios = []; S.disabledScenarioIds = []; save(); render(); toast('Question bank reset.', 'warn'); }),
  exportBank: () => { downloadJSON({ app: 'oaksGravesSalesShowdown', type: 'questionBank', version: APP_VERSION, exportedAt: new Date().toISOString(), customScenarios: S.customScenarios, disabledScenarioIds: S.disabledScenarioIds, defaultScenarios: DEFAULT_SCENARIOS }, `sales-showdown-question-bank-${new Date().toISOString().slice(0, 10)}.json`); toast('Question bank exported.'); },
  importBank: () => pickFile('.json,application/json', importBankText),
  addRep: () => repForm(null), editRep: a => { const r = getRep(a); if (r) repForm(r); }, saveRep: () => saveRepFromForm(),
  removeRep: a => { const r = getRep(a); if (!r) return; confirmDialog({ title: `Remove ${esc(r.name)}?`, message: 'Their all-time stats are deleted. Any current-session results stay in standings and coaching history.', okLabel: 'Remove', danger: true }).then(ok => { if (ok) { removeRep(a); render(); toast('Rep removed.', 'warn'); } }); },
  toggleRepActive: a => { const r = getRep(a); if (!r) return; r.active = !r.active; save(); render(); },
  activateFiltered: a => { const on = a === '1'; const list = S.roster.filter(r => (rf.market === 'all' || r.market === rf.market) && (rf.company === 'all' || r.company === rf.company) && (rf.status === 'all' || (rf.status === 'active') === !!r.active) && (!rf.q || r.name.toLowerCase().includes(rf.q.toLowerCase()))); list.forEach(r => r.active = on); save(); render(); toast(`${list.length} rep${list.length === 1 ? '' : 's'} ${on ? 'activated' : 'deactivated'}.`); },
  bulkPaste: () => bulkPasteModal(), bulkPasteConfirm: () => bulkPasteConfirm(),
  resetStats: () => confirmDialog({ title: 'Reset game statistics?', message: 'All-time wins, losses, points and rubric totals are zeroed for every rep. The roster itself is kept.', okLabel: 'Reset stats', danger: true }).then(ok => { if (ok) { resetRosterStats(); render(); toast('Statistics reset.', 'warn'); } }),
  resetRoster: () => confirmDialog({ title: 'Reset roster to defaults?', message: 'Replaces the roster with the seven default Rochester reps. Custom reps and their stats are removed.', okLabel: 'Reset roster', danger: true }).then(ok => { if (ok) { S.roster = clone(DEFAULT_REPS); save(); render(); toast('Roster reset to defaults.', 'warn'); } }),
  exportData: () => exportData(), importData: () => pickFile('.json,application/json', importDataText),
  resetSession: () => resetSessionConfirm(), factoryReset: () => factoryReset(),
  shortcutHelp: () => openModal(`<h2>Keyboard Shortcuts</h2><div class="shortcut-grid">${SHORTCUTS.map(([k, d]) => `<div><span>${d}</span><span class="kbd">${k}</span></div>`).join('')}</div><p class="small muted mt">Shortcuts are ignored while typing in a text field.</p><div class="actions"><button class="btn btn-primary" data-action="modalCancel">Close</button></div>`)
};
function doFactoryReset() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) { }
  S = defaultState(); Timer.stop(true); saveNow(); render(); toast('Factory reset complete.', 'warn');
}
const Changes = {
  setupName: v => { S.settings.sessionName = v; save(); },
  setupMarket: v => { setupDraft.market = v; render(); },
  setupToggleRep: (v, el, a) => { if (el.checked) { if (!setupDraft.participants.includes(a)) setupDraft.participants.push(a); } else setupDraft.participants = setupDraft.participants.filter(x => x !== a); render(); },
  setupToggleCat: (v, el, a) => { if (el.checked) { if (!setupDraft.cats.includes(a)) setupDraft.cats.push(a); } else setupDraft.cats = setupDraft.cats.filter(x => x !== a); render(); },
  toggleSetting: (v, el, a) => { S.settings[a] = !!el.checked; save(); updateHeader(); if (a === 'sound' && el.checked) Sound.click(); },
  coachNote: v => { const m = S.currentSession && S.currentSession.currentMatch; if (m) { m.coachingNote = v; save(); } },
  coachingFilter: v => { coachingFilter = v; render(); },
  qbSearch: v => { qb.q = v; renderDebounced(); }, qbCat: v => { qb.cat = v; render(); }, qbVal: v => { qb.val = v; render(); }, qbScope: v => { qb.scope = v; render(); }, qbStatus: v => { qb.status = v; render(); },
  rfSearch: v => { rf.q = v; renderDebounced(); }, rfMarket: v => { rf.market = v; render(); }, rfCompany: v => { rf.company = v; render(); }, rfStatus: v => { rf.status = v; render(); }
};
let rdT = null;
function renderDebounced() { if (rdT) clearTimeout(rdT); rdT = setTimeout(() => { const ae = document.activeElement; const key = ae && ae.dataset ? ae.dataset.change : null; const pos = ae && ae.selectionStart; render(); if (key) { const el = $(`[data-change="${key}"]`); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) { } } } }, 180); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el || el.disabled) return;
  const fn = Actions[el.dataset.action]; if (!fn) return;
  Sound.ensure();
  try { fn(el.dataset.arg, el, e); } catch (err) { console.error(err); toast('Something went wrong: ' + err.message, 'err'); }
});
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (!el) return; const isText = el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && el.type !== 'checkbox' && el.type !== 'radio'); if (isText) return; /* text fields are handled on 'input' */ const fn = Changes[el.dataset.change]; if (fn) fn(el.value, el, el.dataset.arg); });
document.addEventListener('input', e => { const el = e.target.closest('[data-change]'); if (!el) return; if (el.tagName === 'SELECT' || el.type === 'checkbox') return; const fn = Changes[el.dataset.change]; if (fn) fn(el.value, el, el.dataset.arg); });

/* =====================================================================
   SECTION 27 — KEYBOARD SHORTCUTS
   ===================================================================== */
document.addEventListener('keydown', e => {
  const t = e.target; const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
  if (e.key === 'Escape') { if ($('#modalRoot').children.length) { closeModal(); e.preventDefault(); } return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  const inRound = ['battle', 'sudden'].includes(S.view);
  switch (e.key) {
    case ' ': if (inRound) { e.preventDefault(); Timer.toggle(); } else if (S.view === 'wheel' && !$('#modalRoot').children.length) { e.preventDefault(); spinWheel(); } break;
    case 'r': case 'R': if (inRound) { e.preventDefault(); Timer.reset(); } break;
    case '+': case '=': if (inRound) Timer.add(15); break;
    case 'c': case 'C': if (S.view === 'battle') triggerPushback(false); break;
    case 'w': case 'W': if (S.currentSession) go('wheel'); break;
    case 'b': case 'B': if (S.currentSession) go('board'); break;
    case 's': case 'S': go('standings'); break;
    case 'h': case 'H': go('home'); break;
    case 'f': case 'F': Actions.fullscreen(); break;
    case 'm': case 'M': Actions.toggleSound(); break;
    case 'p': case 'P': Actions.togglePresentation(); break;
    case 'u': case 'U': undo(); break;
    case '?': Actions.shortcutHelp(); break;
  }
});
window.addEventListener('beforeprint', () => { if (S.view === 'recap' && !$('#printArea').innerHTML) printRecap(); });

/* =====================================================================
   SECTION 28 — BOOT
   ===================================================================== */
(function boot() {
  Storage.probe();
  const raw = Storage.load();
  try { S = migrate(raw || defaultState()); } catch (e) { console.error(e); S = defaultState(); Storage.warning = 'Saved data could not be loaded; defaults restored.'; }
  if (Storage.warning) showStorageWarning(Storage.warning);
  // Restore into the right screen for the match phase after a refresh.
  const c = S.currentSession;
  if (c && c.currentMatch && SESSION_VIEWS.includes(S.view)) S.view = phaseView(c.currentMatch.phase);
  if (c && !c.currentMatch && ['battle', 'judge', 'sudden', 'result'].includes(S.view)) S.view = 'wheel';
  if (!c && SESSION_VIEWS.includes(S.view)) S.view = 'home';
  if (c) Timer.configure(c.timerSeconds);
  document.body.classList.toggle('presentation', !!S.settings.presentation);
  render(); saveNow();
  window.addEventListener('resize', () => { if (Wheel.canvas) Wheel.draw(); });
})();
</script>
</body>
