<script>
'use strict';
/* =====================================================================
   SECTION 1 — DATA
   DEFAULT_REPS, CATEGORIES, DEFAULT_SCENARIOS, SUDDEN_DEATH_SCENARIOS
   ===================================================================== */
const APP_VERSION = 1;
const STORAGE_KEY = 'oaksGravesSalesShowdown_v1';
const DEFAULT_COMPANY = 'Oaks / Graves Exterior Sales';
const DEFAULT_MARKET = 'Rochester';

const DEFAULT_REPS = [
  'Steven Kline','Cory Grant','Jeff Kline','Tom Rodak','Trey Love','Will Jamison','Aaron Wight'
].map((name, i) => makeRep(name, DEFAULT_MARKET, DEFAULT_COMPANY, 'rep-default-' + (i + 1)));

function makeRep(name, market, company, id) {
  return {
    id: id || uid('rep'), name: name.trim(), market: (market || DEFAULT_MARKET).trim(), company: (company || DEFAULT_COMPANY).trim(),
    active: true, appearances: 0, matchWins: 0, matchLosses: 0, roundWins: 0, totalPoints: 0, totalRubricPoints: 0, rubricRounds: 0
  };
}

const CATEGORIES = [
  'Objection Gauntlet','Price vs Value','Discovery','Close the Deal','Competitor Battle','Technical Confidence',
  'Financing & Budget','Trust & Company Story','Scope Match','Curveball Customer','Follow-Up / Rehash','Control the Appointment'
];
const TILE_VALUES = [100, 200, 300, 400, 500];
const SCOPES = ['Roofing','Siding','Windows','Doors','Gutters'];
const RUBRIC = [
  { key: 'connect', title: 'Connect', desc: 'Listened and acknowledged the homeowner before responding.' },
  { key: 'clarify', title: 'Clarify', desc: 'Asked questions to uncover the real objection or motivation.' },
  { key: 'value', title: 'Create Value', desc: 'Tied the Oaks / Graves solution to what the homeowner said matters.' },
  { key: 'control', title: 'Control', desc: 'Confident, concise, no arguing, no premature discounting.' },
  { key: 'close', title: 'Close', desc: 'Advanced the sale with a question or a logical next step.' }
];

/* ---------------------------------------------------------------------
   DEFAULT_SCENARIOS — 12 categories × 5 values
   --------------------------------------------------------------------- */
const DEFAULT_SCENARIOS = [
/* ===================== OBJECTION GAUNTLET ===================== */
{ id:'og-100', category:'Objection Gauntlet', value:100, scope:['Roofing'], difficulty:1, persona:'Retired homeowner',
  situation:'You have finished a full roof presentation for a retired couple. They liked the inspection photos, nodded through the company story, and were friendly the whole time. You ask for the business.',
  homeowner:'Oh, we never make a decision the same day. We have a rule about that. Leave us the paperwork and we\'ll let you know.',
  hiddenContext:'There is no competing quote. The rule is a habit from a time they got burned on a vacuum-cleaner sale decades ago. They are not actually uncertain about the roof — just about being rushed.',
  followUps:['It\'s just a rule we\'ve always had. Nothing against you.','What\'s the harm in a few days?'],
  coachKey:{
    objective:'Respect the homeowner\'s rule without abandoning the close. Find out what a few days would actually accomplish and whether anything is unresolved.',
    strongBehaviors:['Acknowledges the rule sincerely rather than treating it as an obstacle','Asks what they want to think through or who they want to talk to','Checks whether anything in the presentation is still unclear','Offers a concrete, low-pressure next step with a date and time','Stays warm — this is not a fight'],
    weakBehaviors:['Manufactures urgency or a fake price deadline','Launches into a monologue about "same day" decisions','Argues with the rule','Leaves with no scheduled follow-up','Immediately offers a discount to sign today'],
    approach:'Agree that not being rushed is smart. Then ask: "So I make sure you have everything — what will you two be talking about after I leave?" Isolate the real item, address it, and propose a specific next step rather than "let me know."'
  } },
{ id:'og-200', category:'Objection Gauntlet', value:200, scope:['Windows'], difficulty:2, persona:'Young first-time homeowners',
  situation:'A couple in their late twenties bought their first house last year. You have shown them a whole-house window replacement. Twice during the visit they asked how long installation takes and whether the house would be "open" during the work.',
  homeowner:'We really like it. We just need to sleep on it. It\'s a big decision for us.',
  hiddenContext:'They have a newborn and are anxious about dust, cold air, and strangers in the house for days. "Sleep on it" is about the disruption, not the product or the price.',
  followUps:['We just want to be sure we\'re not rushing into anything.','If we call you Thursday, is everything still the same?'],
  coachKey:{
    objective:'Recognize the repeated installation questions as the real concern and address it directly before asking for a decision.',
    strongBehaviors:['Connects "sleep on it" back to what they asked about earlier','Asks what specifically they want to feel sure about','Explains the installation day process honestly and calmly','Acknowledges the baby / home-disruption concern without making assumptions','Asks for the business after addressing the concern'],
    weakBehaviors:['Repeats product features they already liked','Treats "sleep on it" as a price objection','Overpromises about install speed or a mess-free job','Leaves without addressing installation logistics','Never asks a question'],
    approach:'"You asked a couple of times about how long we\'re in the house — is that part of what you want to think through?" Then walk through how the install day actually works, room by room, and ask if that removes the hesitation.'
  } },
{ id:'og-300', category:'Objection Gauntlet', value:300, scope:['Roofing'], difficulty:3, persona:'Analytical homeowner',
  situation:'Your inspection found heavy granule loss, several cracked pipe boots, lifted shingles on the south slope, and a soft spot near the chimney. The homeowner is methodical, asked good questions, and has looked at every photo carefully.',
  homeowner:'Here\'s my issue. The roof isn\'t leaking. Nothing\'s coming through the ceiling. Why would I replace something that\'s working?',
  hiddenContext:'He has a finished attic office with expensive equipment. He mentioned it in passing when you were setting up. He plans to stay in the house at least ten more years.',
  followUps:['Every roofer says the same thing. Of course you want me to replace it.','So realistically, it could last another five years, couldn\'t it?'],
  coachKey:{
    objective:'Help an analytical homeowner understand the difference between "not leaking yet" and "in good condition" using his own inspection photos, and connect it to what he has at risk.',
    strongBehaviors:['Acknowledges that his logic is reasonable','Uses the specific findings from his roof, not generic roofing talk','Asks what a leak would put at risk (finished attic, equipment)','Distinguishes honestly between urgent and planned replacement without scare tactics','Asks what would make replacement the right decision in his mind'],
    weakBehaviors:['Fear-mongering about imminent collapse','Vague "it\'s old" arguments with no evidence','Guaranteeing a specific remaining lifespan either way','Getting defensive about "every roofer says that"','Skipping the ask'],
    approach:'Validate the question. Walk back through two or three specific photos and explain what each one leads to over time. Ask what is in the attic and what the plan is for the house. Then ask whether he would rather replace on his schedule or the roof\'s schedule — and ask for the decision.'
  } },
{ id:'og-400', category:'Objection Gauntlet', value:400, scope:['Roofing'], difficulty:4, persona:'Homeowner with active leak',
  situation:'The homeowner called about a leak above the kitchen. Your inspection shows a 22-year-old three-tab roof with widespread wear, exposed nail heads, and a failed flashing detail at the leak. You have recommended full replacement. A handyman already quoted a patch.',
  homeowner:'Look, I appreciate the thorough job, but I have one spot leaking. Can\'t you just repair that section? The other guy said $900 and he can do it Saturday.',
  hiddenContext:'She mentioned early on that she "might" sell in two or three years, but also said her daughter\'s family may move in with her. She is unsure about how long she is staying, and the $900 feels like the "safe" choice while she figures it out.',
  followUps:['The repair guy quoted nine hundred bucks. Nine hundred versus twenty thousand isn\'t close.','I\'m not trying to spend twenty grand on a house I might not even be in forever.'],
  coachKey:{
    objective:'Determine whether this is really a repair-vs-replace question or an uncertainty-about-the-future question, and give her an honest framework for either path.',
    strongBehaviors:['Acknowledges the repair is a legitimate option and says what it would and would not solve','Asks about her plans for the house and what has changed','Explains honestly what a patch on a roof in this condition buys her','Connects replacement to resale or to her daughter\'s family staying dry','Offers a clear recommendation and asks her to decide'],
    weakBehaviors:['Refusing to discuss repair at all','Trashing the handyman','Pretending a patch is impossible','Ignoring the "might sell" comment','Immediately dropping price to compete with $900'],
    approach:'Agree that $900 vs. a full roof is a real difference, then ask what her plan for the house actually is. If she stays, the patch is a down payment on a roof she still has to buy. If she sells, a documented new roof is a selling point. Give her the honest trade-offs and ask which future she is planning for.'
  } },
{ id:'og-500', category:'Objection Gauntlet', value:500, scope:['Roofing'], difficulty:5, persona:'Emotionally motivated homeowner',
  situation:'A family with two teenagers. The roof is actively leaking into the daughter\'s bedroom; there is a brown stain spreading across her ceiling. During the walk-through the father joked, a little tightly, about "overtime drying up." The mother mentioned twice that they have not looked into how they would pay for it.',
  homeowner:'We\'ve talked about it and we\'re going to wait until spring. It just makes more sense to do it when the weather\'s better.',
  hiddenContext:'This is not about weather. The father recently lost overtime hours and is embarrassed to discuss money in front of the kids. They do not know whether they could be approved for financing and would rather say "spring" than "we can\'t afford it." The leak will get worse over winter.',
  followUps:['Spring is just better for us. Everybody does roofs in the spring.','Honestly... it\'s a lot of money right now.'],
  coachKey:{
    objective:'Recognize that "spring" is covering a budget and dignity concern. Create a private, respectful space to talk about paying for it without making anyone feel judged — and keep the daughter\'s bedroom in the conversation.',
    strongBehaviors:['Acknowledges the timing rationale without immediately arguing weather','Gently asks what waiting until spring would make easier','Reads the room — suggests continuing the conversation at the kitchen table, away from the kids','Explains honestly what an active leak does over a winter, without scare tactics','Offers to explore payment options as information, not pressure','Asks for permission to look at options together'],
    weakBehaviors:['Lecturing about winter roof damage while ignoring the money signal','Quoting specific financing terms or approvals that are not confirmed','Making the father feel exposed in front of the kids','Accepting "spring" and leaving','Discounting before understanding the real issue'],
    approach:'Agree that spring is a common choice, then ask what would be different in spring. Listen for the money answer. Lower the pressure: "A lot of families I sit with want to know what the monthly picture looks like before deciding anything — would it help to look at that?" Tie it back to the bedroom and ask for a decision on the next step.'
  } },

/* ===================== PRICE VS VALUE ===================== */
{ id:'pv-100', category:'Price vs Value', value:100, scope:['Siding'], difficulty:1, persona:'Price shopper',
  situation:'You are the first company out for a full siding replacement. You presented the investment and the homeowner\'s eyes went wide.',
  homeowner:'Whoa. You guys are way too expensive. I figured siding would be about half that.',
  hiddenContext:'He has never priced siding before. His number came from a neighbor who had a partial repair done years ago. He does not actually have a budget yet.',
  followUps:['I honestly figured it would be about half that.','So what can you do on the price?'],
  coachKey:{
    objective:'Find out where the homeowner\'s expectation came from before defending or adjusting the price.',
    strongBehaviors:['Stays calm and acknowledges the sticker shock','Asks where "half that" came from','Explains what a complete siding project includes without lecturing','Ties the investment to what he told you he wanted','Asks a closing question'],
    weakBehaviors:['Immediately offering a discount','Sounding defensive or apologetic about the price','Long feature dump','Arguing with his number','Ending with "think about it"'],
    approach:'"That\'s a fair reaction — what were you expecting it to come in at, and where did that number come from?" Then close the gap between a partial repair and a complete, warrantied replacement, and ask if the scope is right before talking about price.'
  } },
{ id:'pv-200', category:'Price vs Value', value:200, scope:['Roofing'], difficulty:2, persona:'Friendly homeowner with a competing quote',
  situation:'The homeowner likes you and has been open the whole time. Another company was out last week. Your proposal is about $4,200 higher.',
  homeowner:'I really do like you guys better. Can you match their price? If you can match it, I\'ll sign right now.',
  hiddenContext:'The other proposal is a one-page quote with no line items. The homeowner has not compared what is included — she assumes both are "a new roof."',
  followUps:['It\'s the same shingle, from what I can tell.','If you can\'t match it, can you at least meet me halfway?'],
  coachKey:{
    objective:'Turn "match their price" into a scope comparison without disparaging the other company, and defend the value with specifics.',
    strongBehaviors:['Appreciates the honesty and the preference for your company','Asks to see what the other proposal includes','Compares scope item by item in plain language','Explains why the difference exists instead of just saying "we\'re worth it"','Asks for the business on the full proposal'],
    weakBehaviors:['Matching or splitting the difference immediately','Saying the competitor is bad or cutting corners with no evidence','Getting flustered by "sign right now"','Skipping the comparison and re-pitching features','Losing the close because the price did not move'],
    approach:'"I appreciate that — before I answer, can we put the two side by side? I want to make sure we\'re comparing the same roof." Walk through what is included in yours. Ask which items she wants to remove to get to their number. Then ask for the decision.'
  } },
{ id:'pv-300', category:'Price vs Value', value:300, scope:['Windows'], difficulty:3, persona:'Busy executive',
  situation:'A busy executive scheduled you for 5:30 and kept checking his watch. He cut off the inspection walk-through and skipped the product demo.',
  homeowner:'I don\'t care about all that. Just give me the bottom line. What\'s the number?',
  hiddenContext:'He replaced windows at a previous house and the installer left gaps that whistled all winter. He has not told you this. He is impatient partly because he assumes all window companies give the same speech.',
  followUps:['I\'ll make my decision based on the number, not the speech.','Everyone gives me the same story about quality.'],
  coachKey:{
    objective:'Give him the number confidently, but earn two or three questions first so the number means something. Do not let the appointment turn into a price-only comparison.',
    strongBehaviors:['Respects his time and says exactly how long you need','Gives a direct answer rather than dodging','Asks one sharp question about what went right or wrong with windows before','Focuses on the two or three things that matter to him, not the whole deck','Proposes a clear decision path'],
    weakBehaviors:['Refusing to give a price until the "full presentation"','Rambling through the entire presentation anyway','Sounding intimidated or rushed','Quoting a number with zero context','Failing to ask for the business because he seems annoyed'],
    approach:'"Happy to. Give me three minutes and two questions so the number I give you is the right one." Ask about his last window experience. Then present the number, tie it to the one thing he cares about, and ask if he wants to move forward tonight or set the install.'
  } },
{ id:'pv-400', category:'Price vs Value', value:400, scope:['Roofing'], difficulty:4, persona:'Skeptical homeowner with a lower quote',
  situation:'You have finished the presentation. The homeowner closes the proposal, slides it back across the table and delivers the line below. Earlier in the visit he mentioned that the attic is "like an oven" in summer and that they had an ice dam last winter.',
  homeowner:'I like you guys, but I\'m not paying thirty grand for a roof. The other company was twenty-two. If you can\'t get somewhere near that, there\'s really nothing else to talk about.',
  hiddenContext:'The $22k proposal has no ventilation work, ice-and-water protection only at the eaves, and a small decking allowance with "additional at cost." Neither the attic heat nor the ice dam would be addressed.',
  followUps:['I hear you, but eight thousand is still eight thousand.','They said they\'d handle anything they find up there.'],
  coachKey:{
    objective:'Hold the price without arguing, and reconnect the difference to the problems he told you about — attic heat and ice dams — that a like-for-like roof would not solve.',
    strongBehaviors:['Does not flinch, does not discount, does not get defensive','Acknowledges that $8,000 is real money','Asks what the other proposal does about the attic heat and ice dam he described','Explains the scope difference in plain language tied to his stated problems','Gives him a clear choice and asks for the decision'],
    weakBehaviors:['Immediately negotiating','Saying the competitor is cutting corners without knowing their scope','Repeating features unrelated to his concerns','Debating shingle brands','Letting "nothing else to talk about" end the conversation'],
    approach:'"You\'re right, $8,000 is real. Before we talk about the number — you told me the attic is an oven and you had an ice dam. What does the other proposal do about those two things?" Let him look. Then explain what yours does and ask which roof actually solves the problem he called about.'
  } },
{ id:'pv-500', category:'Price vs Value', value:500, scope:['Siding','Roofing'], difficulty:5, persona:'Previous bad-contractor victim',
  situation:'A full siding-and-roof project. During the walk-through the homeowner asked, three separate times, about who would actually be on site: whether the crew is supervised, whether you use subcontractors, and who to call if something is damaged. She never mentioned any other quote.',
  homeowner:'I\'ve got to be honest, your price is too high. It\'s just more than I think this should cost.',
  hiddenContext:'Two years ago a contractor\'s crew crushed her landscaping, cracked a window, and left debris in the yard for a week; the owner stopped returning calls. Price is a socially easier objection than "I am afraid of letting a crew near my house again." She has no competing quote.',
  followUps:['I just don\'t see why it costs that much.','What happens if something gets damaged? Who do I even call?'],
  coachKey:{
    objective:'Recognize that the repeated crew-and-supervision questions are the actual objection. Return to that concern with specifics before ever discussing the price.',
    strongBehaviors:['Acknowledges the price comment without immediately defending it','Asks what "should" cost is based on — surfaces that there is no other quote','Circles back: "You asked a few times about the crew — can I ask what happened?"','Listens to the story fully before responding','Explains concretely how the project is supervised and how issues are handled — only what is true','Asks if that changes how she feels about moving forward'],
    weakBehaviors:['Launching into a price justification','Offering a discount to a homeowner who does not actually have a price problem','Missing the crew questions entirely','Promising perfection or "nothing ever goes wrong"','Closing on price instead of on trust'],
    approach:'"Fair enough. Can I ask — what does it feel like it should cost, and is that based on another proposal?" Then: "You\'ve asked about the crew a few times. Did something happen on a past project?" Let her tell it. Address supervision and communication honestly. Then ask: "If you felt confident about the crew, would the number still be the issue?"'
  } },

/* ===================== DISCOVERY ===================== */
{ id:'di-100', category:'Discovery', value:100, scope:['Roofing'], difficulty:1, persona:'Direct homeowner at the door',
  situation:'You have just arrived. You are standing in the doorway with your tablet. Before you can introduce yourself properly, the homeowner asks:',
  homeowner:'So, how much is a roof going to cost me? Just give me the range and we\'ll go from there.',
  hiddenContext:'He is not hostile — he just wants to know if he is wasting his evening. He has a leak in the garage he has not mentioned yet.',
  followUps:['I\'d rather just know a ballpark before we go through all this.','How long is this going to take?'],
  coachKey:{
    objective:'Set the agenda without stonewalling. Earn the right to inspect and ask questions by explaining why a real number requires looking at his roof.',
    strongBehaviors:['Friendly, direct acknowledgment of the question','Explains briefly why a ballpark from the doorway would be a guess','Sets a clear agenda and time expectation','Asks the first discovery question right away — what prompted the call?','Gets invited in'],
    weakBehaviors:['Quoting a number from the doorstep','Vague "it depends" with no path forward','Long-winded company intro before answering him','Sounding defensive about not giving a price','Not asking what prompted the appointment'],
    approach:'"Totally fair question. I don\'t want to guess at your roof from the porch — give me about 20 minutes on the roof and a few questions, and I\'ll give you an exact number tonight. Quick one to start: what made you call now?"'
  } },
{ id:'di-200', category:'Discovery', value:200, scope:['Roofing','Siding'], difficulty:2, persona:'Quiet homeowner',
  situation:'A quiet homeowner has said very little. You sit down at the kitchen table and before you can begin discovery she says:',
  homeowner:'Just so you know, we\'re getting three estimates. We\'re not deciding anything tonight.',
  hiddenContext:'Her decision criteria have nothing to do with price. Her sister used a contractor who disappeared mid-job. She wants to know who will actually show up and finish. She will not volunteer this — she has to be asked.',
  followUps:['We\'re just doing our due diligence.','What makes you different than the other two coming out?'],
  coachKey:{
    objective:'Use the "three estimates" statement as a doorway to discover how she will actually decide, not as an objection to overcome.',
    strongBehaviors:['Agrees that comparing is smart','Asks how she plans to compare the three — what will matter most','Draws out a quiet homeowner with open, patient questions','Listens for the real criteria (reliability, communication) and reflects it back','Positions the appointment around her criteria'],
    weakBehaviors:['Immediately pitching why you are different','Trying to talk her out of getting other estimates','Filling silence with talking','Asking only yes/no questions of a quiet person','Skipping discovery and going to the presentation'],
    approach:'"Smart. Most people we sit with do the same. Can I ask — when the three are in front of you, how will you decide? What would make one stand out?" Give her room to answer. Then ask what experiences, good or bad, she or people she knows have had with contractors.'
  } },
{ id:'di-300', category:'Discovery', value:300, scope:['Gutters','Siding'], difficulty:3, persona:'Budget-conscious homeowner',
  situation:'The appointment was booked as "a quote for gutters." Walking the house you notice rotted fascia along the back, siding staining below the gutter line, and soffit damage at one corner. Before you say anything about it, the homeowner cuts in:',
  homeowner:'I just need gutters. Nothing else. I know how this goes — everyone shows up for one thing and tries to sell me the whole house.',
  hiddenContext:'He has had two contractors "upsell" him and is braced for it. However, the fascia rot is real, and new gutters cannot be properly attached to it. He does not know this.',
  followUps:['I don\'t have the budget for a bigger project right now.','Why does everyone try to upsell me?'],
  coachKey:{
    objective:'Respect his stated scope while being honest about what you found, and let him decide with real information rather than being "sold."',
    strongBehaviors:['Acknowledges the upsell fatigue and agrees to stay focused on gutters','Asks what the gutters need to accomplish for him','Shows him the fascia rot as a fact that affects the gutter job, not as a pitch','Explains why it matters to his gutters specifically','Asks how he would like to handle it and offers options'],
    weakBehaviors:['Ignoring the rot to avoid seeming pushy','Pivoting straight into a siding presentation','Talking down to him about what he "needs"','Vague scare talk','Not asking a single question about why gutters, why now'],
    approach:'"Understood — gutters it is. One thing I need to show you because it affects the gutter job itself." Show the fascia. "New gutters mount to this board. What would you like to do about it?" Then return to the gutter scope and close.'
  } },
{ id:'di-400', category:'Discovery', value:400, scope:['Roofing'], difficulty:4, persona:'Couple with different agendas',
  situation:'Both spouses are at the table. One is talkative and has done all the speaking. The other has been quiet and, twice, glanced at a brown stain on the dining-room ceiling. The talkative spouse says:',
  homeowner:'Let\'s be straightforward: we just want the cheapest way to make the house look good before we sell next year. Nothing fancy.',
  hiddenContext:'The quiet spouse does not want to sell and is worried about the leak. They have argued about it. The talkative spouse\'s "cheapest way" is a negotiating position in a conversation with their partner, not just with you.',
  followUps:['(Quiet spouse, finally) Do you think the buyer\'s inspector is going to flag the roof?','We\'ve honestly been going back and forth about whether to fix things or just sell as-is.'],
  coachKey:{
    objective:'Bring the quiet spouse into the conversation and discover that the two homeowners are not aligned — without taking sides — so the recommendation can fit what they actually decide.',
    strongBehaviors:['Acknowledges the stated goal (sell next year, keep it economical)','Deliberately invites the quiet spouse\'s perspective','Asks about the ceiling stain and what they know about it','Explores both paths honestly — sell soon vs. stay — and what each means for the roof','Helps them agree on a decision path before pushing product'],
    weakBehaviors:['Speaking only to the talkative spouse','Jumping to "cheapest" product options without discovery','Taking a side in their disagreement','Ignoring the ceiling stain','Trying to close before they are aligned with each other'],
    approach:'"Got it. Before I build anything — can I get both of your take? [To the quiet spouse] What\'s your biggest concern with the house right now?" Ask about the stain. Then lay out honestly: here is what makes sense if you sell in a year, here is what makes sense if you stay. Ask them which plan they want to build around.'
  } },
{ id:'di-500', category:'Discovery', value:500, scope:['Windows','Siding'], difficulty:5, persona:'Referral customer',
  situation:'A warm referral from a neighbor you did siding for last summer. The homeowner is friendly and trusting and wants to skip everything.',
  homeowner:'The Petersons said you were fantastic. Honestly, just write us up the same thing you did for them and we\'re good.',
  hiddenContext:'The Petersons got siding. This house\'s actual problems are windows: condensation between panes, a drafty back bedroom, and heating bills that jumped last winter. The homeowner has not said any of this because they assume "exterior" means siding. Copying the neighbor\'s project would solve the wrong problem.',
  followUps:['We trust them, we trust you. Just give us the same.','Why all the questions? They said you didn\'t do this with them.'],
  coachKey:{
    objective:'Honor the referral trust while doing real discovery — because the easiest sale (copy the neighbor) may be the wrong solution and would damage the referral relationship later.',
    strongBehaviors:['Thanks them and honors the referral warmly','Explains briefly why you still need to look at their house — every house is different','Asks what is bothering them about the house right now','Listens for drafts, condensation, bills — and follows up on it','Reframes the project around their actual problem','Asks for permission to inspect and present the right solution'],
    weakBehaviors:['Taking the easy order and writing up siding','Skipping the inspection because they are "sold"','Over-explaining the process to a trusting customer','Ignoring signals about comfort or energy','Missing the windows entirely'],
    approach:'"That means a lot — the Petersons were great to work with. Here\'s the thing: their house needed siding. I want to make sure I\'m solving what\'s bugging you, not them. What\'s been annoying you about the house lately?" Follow the answer — likely to the windows — and reframe the project.'
  } },

/* ===================== CLOSE THE DEAL ===================== */
{ id:'cd-100', category:'Close the Deal', value:100, scope:['Roofing'], difficulty:1, persona:'Agreeable homeowner',
  situation:'You have presented the roof, answered every question, and reviewed the investment. The homeowner nods, closes the folder, sits back, and says:',
  homeowner:'Okay. That all sounds good.',
  hiddenContext:'He is ready. He is waiting for you to tell him what happens next. If you keep talking, you will talk yourself out of the sale.',
  followUps:['So... what happens next?','Do we have to decide right now?'],
  coachKey:{
    objective:'Recognize a buying signal and ask for the business clearly and confidently. The test is whether the rep actually closes.',
    strongBehaviors:['Stops presenting','Asks a direct closing question','Explains the next steps simply (paperwork, scheduling, what to expect)','Handles "right now?" without backing down or pressuring','Confident, calm silence after the ask'],
    weakBehaviors:['Continuing to sell after the buying signal','Asking "any other questions?" instead of asking for the business','Softening the ask with "no pressure, whenever you\'re ready"','Rambling about next steps before asking','Offering a discount nobody asked for'],
    approach:'"Great. Then let\'s get you on the schedule. I\'ll walk you through the paperwork — it takes about ten minutes. Does that work?" If he asks about deciding now, explain what committing tonight actually does (locks the scope, gets him a date) and ask again.'
  } },
{ id:'cd-200', category:'Close the Deal', value:200, scope:['Doors','Windows'], difficulty:2, persona:'Independent-minded homeowner',
  situation:'A door and window project. The homeowner was engaged and asked good questions throughout. As you begin the close, she says:',
  homeowner:'Can you just email me the proposal? I like to look at things on my own time.',
  hiddenContext:'She is genuinely interested but dislikes feeling sold to. If she gets an email, the proposal will sit in her inbox and she will not call. There is one line item — the door hardware — she is quietly unsure about.',
  followUps:['I like to look at things on my own time. I\'m not a decide-at-the-table person.','I promise I\'ll get back to you.'],
  coachKey:{
    objective:'Prevent the appointment from turning into an email. Find the real item she needs to think about and resolve it here.',
    strongBehaviors:['Agrees she should be comfortable with the decision','Asks what specifically she wants to look over','Offers to go through the proposal together right now, line by line','Surfaces the door hardware hesitation and handles it','Asks for a decision or a concrete follow-up appointment, not "I\'ll get back to you"'],
    weakBehaviors:['Saying "sure!" and packing up','Refusing to send anything (comes off controlling)','Pressuring her with a deadline','Re-pitching the whole thing','Leaving without a date and time'],
    approach:'"Of course. Can I ask — when you look it over, what will you be looking at? I\'d rather answer that now while I\'m here than have you guessing." Find the item, resolve it, ask: "If that\'s clear, is there anything else stopping us from getting this scheduled?"'
  } },
{ id:'cd-300', category:'Close the Deal', value:300, scope:['Siding'], difficulty:3, persona:'Private couple',
  situation:'A couple in their fifties loved the siding samples and the color visualizer. You ask for the business.',
  homeowner:'We\'ll call you. We just want to talk it over privately, the two of us.',
  hiddenContext:'They actually agree with each other and like the project. The hesitation is the wife\'s: she wants to make sure the color works with the roof and brick — a small detail she feels silly bringing up in front of a salesperson.',
  followUps:['We just need to talk it over between us. That\'s how we do things.','What if we call you Monday?'],
  coachKey:{
    objective:'Respect their desire to talk privately while making sure the thing they want to talk about gets resolved before you leave — and lock a next step.',
    strongBehaviors:['Respects the request and offers to step outside for a few minutes','Asks what they want to talk through so the answer is available','Surfaces the color concern and helps solve it (samples, visualizer, roof/brick)','Proposes a decision when they come back together','If they do wait: schedules a specific follow-up rather than "Monday"'],
    weakBehaviors:['Pressuring them to decide in front of you','Leaving immediately','Assuming it is about price','Ignoring the wife\'s hesitation','Accepting "we\'ll call you" with no date'],
    approach:'"Absolutely — want me to step out to the truck for ten minutes? Before I do: what\'s the main thing you two want to talk through? If it\'s something I can answer, I\'d hate for you to guess." Resolve the color question. Then give them the room, and come back to ask.'
  } },
{ id:'cd-400', category:'Close the Deal', value:400, scope:['Roofing'], difficulty:4, persona:'Thorough first-quote homeowners',
  situation:'The homeowners liked everything: the inspection, the company story, the proposal. They mention two more companies are scheduled this week.',
  homeowner:'Here\'s the thing — you\'re the first quote we\'re getting. It just feels wrong not to compare. We\'d be crazy to sign with the first person who walks in, right?',
  hiddenContext:'Their fear is not that you are wrong — it is that they will look foolish if a cheaper quote shows up later. Their real question is "how do I protect myself if I say yes now?"',
  followUps:['It just feels irresponsible to not compare.','If we sign tonight and then get a cheaper quote Thursday, what then?'],
  coachKey:{
    objective:'Address the fear of "buying wrong" honestly — what would the other quotes tell them, and how can they compare intelligently — while still asking for the decision.',
    strongBehaviors:['Validates that comparing is a reasonable instinct','Asks what they would be looking for the other two to tell them','Helps them build a comparison checklist based on what they already learned','Addresses "what if cheaper?" with honesty rather than a gimmick','Asks for the decision, or a firm follow-up after the other appointments'],
    weakBehaviors:['Manufactured "tonight-only" pricing','Disparaging companies they have not met yet','Talking around the "what if cheaper" question','Getting visibly frustrated at being first','Leaving without a scheduled return'],
    approach:'"You\'re not crazy — that\'s a smart instinct. What would the next two quotes need to show you to help you decide?" Build their comparison list from what they saw today. Address the cheaper-quote fear honestly. Then ask: "If they can\'t show you those things, is there any reason to wait?"'
  } },
{ id:'cd-500', category:'Close the Deal', value:500, scope:['Roofing'], difficulty:5, persona:'Hesitant decision-maker',
  situation:'A husband meets with you alone; his wife is at work. Early on he told you they both agree the roof needs to be replaced and that she already picked the shingle color from a brochure. You ask for the business.',
  homeowner:'I need to talk to my wife before I sign anything.',
  hiddenContext:'She has already agreed. His hesitation is about the payment structure — he does not fully understand the options you showed him and does not want to admit it or make the wrong choice alone. "Talk to my wife" is protecting him from a decision he feels unequipped to make.',
  followUps:['She\'d kill me if I signed without her.','Can you just come back Saturday when she\'s here?'],
  coachKey:{
    objective:'Determine whether spousal approval is truly the obstacle — given he already said they agree — and uncover the real hesitation (payment understanding) without embarrassing him.',
    strongBehaviors:['Respects the marriage and does not try to "get around" the wife','Gently reflects what he said earlier: they agree, she picked the color','Asks what specifically she would want to weigh in on','Notices the payment-option confusion and re-explains simply, as a natural part of the conversation','Offers a real Saturday option only after confirming what would happen then','Asks for a decision on the next step'],
    weakBehaviors:['Pressuring him to sign without her','Taking "talk to my wife" at face value and leaving','Ignoring that they already agreed','Re-pitching the roof','Making him feel dumb about the financing question'],
    approach:'"Of course — and I\'d never want you to sign something she\'s not on board with. Earlier you mentioned you two already agree on the roof and she picked the color. What would she want to think through?" Listen. If it drifts toward payments: "Let me walk back through the options — I went fast on that." Then propose either a call to her now or a Saturday appointment with a clear purpose.'
  } },

/* ===================== COMPETITOR BATTLE ===================== */
{ id:'cb-100', category:'Competitor Battle', value:100, scope:['Gutters'], difficulty:1, persona:'Cost-conscious homeowner',
  situation:'A gutter replacement. You have presented the system and the price.',
  homeowner:'My neighbor says he can do it. He did his own last year. Said he\'d do mine for materials plus a case of beer.',
  hiddenContext:'The neighbor\'s gutters already sag at one corner. The homeowner has noticed but has not connected it to the DIY job.',
  followUps:['He did his own last year and they look fine to me.','What am I really paying you for — it\'s gutters.'],
  coachKey:{
    objective:'Differentiate a professional gutter system without insulting the neighbor, and help the homeowner think about what he is actually buying.',
    strongBehaviors:['Does not insult the neighbor','Asks what he wants the gutters to do and for how long','Explains what a professional install includes (pitch, hangers, sealing, warranty, accountability)','Uses a simple example of what goes wrong when gutters are not pitched or fastened properly','Asks for the business'],
    weakBehaviors:['Mocking the neighbor or the beer comment','Dropping price to compete with "free"','Getting into technical weeds','Sounding offended','No close'],
    approach:'"Honestly, good neighbor to have. Question for you — what do you want these gutters to do for the next fifteen years?" Then explain what you are responsible for that a neighbor is not, and ask if he would rather have someone accountable for it.'
  } },
{ id:'cb-200', category:'Competitor Battle', value:200, scope:['Roofing'], difficulty:2, persona:'Impatient homeowner',
  situation:'Roof replacement. The homeowner has a competing quote and is anxious to get the project done before a family event.',
  homeowner:'The other guy can start next week. Your timeline is too long. I don\'t want to be waiting around for months.',
  hiddenContext:'For roleplay purposes, assume your realistic timeline is a few weeks out, not "months." The homeowner has inflated the difference. The family event is six weeks away.',
  followUps:['I don\'t want to be waiting around for months.','Why does it take you longer? Are you that busy or that slow?'],
  coachKey:{
    objective:'Clarify the actual timeline and the actual deadline before defending anything, and help the homeowner think about what a very fast start might indicate — without disparaging the competitor.',
    strongBehaviors:['Acknowledges the urgency','Asks what the real deadline is (the event) and confirms your realistic window','Explains honestly what drives scheduling (materials, permits, crew scheduling) without inventing specifics','Reframes "start next week" as something worth asking questions about, not attacking','Asks if the timeline works and closes'],
    weakBehaviors:['Promising a start date you cannot guarantee','Saying the competitor must be desperate or bad','Getting defensive about "slow"','Ignoring the family event','No close'],
    approach:'"Totally understand — what\'s the date you need it done by?" Confirm your realistic window against it. "Here\'s what actually determines the schedule…" Then: "If we can be done well before the event, does that solve the timing concern?"'
  } },
{ id:'cb-300', category:'Competitor Battle', value:300, scope:['Siding'], difficulty:3, persona:'Comparison shopper',
  situation:'Siding replacement. The homeowner has a written quote from another contractor for the same brand of siding.',
  homeowner:'The other contractor says they\'re using basically the same materials as you. Same brand, same everything. So I\'m paying extra for... what, exactly?',
  hiddenContext:'The other quote does not mention housewrap, flashing details around windows, or what happens if rotted sheathing is found. The homeowner is asking a fair question and deserves a straight answer.',
  followUps:['It\'s the same brand. Siding is siding.','So I\'m paying extra for what?'],
  coachKey:{
    objective:'Explain, in plain language, that the panel is the smallest part of a siding job, and help the homeowner compare the two proposals on installation details and accountability.',
    strongBehaviors:['Agrees the panel itself may well be the same','Asks to review the other proposal for the parts underneath the siding','Explains what is behind the siding (moisture management, flashing, trim, sheathing) in plain terms','Differentiates on process, supervision, and standing behind the work — not on trashing the competitor','Asks for the business'],
    weakBehaviors:['Claiming a superior brand when it is the same brand','Attacking the other contractor\'s quality without evidence','Drowning the homeowner in jargon','Immediately price-matching','No close'],
    approach:'"You\'re right — the panel may be identical. The panel is also maybe a third of what makes siding last. Can we look at what each proposal says about what goes on the wall before the siding does?" Compare. Then ask which job he wants on his house.'
  } },
{ id:'cb-400', category:'Competitor Battle', value:400, scope:['Windows'], difficulty:4, persona:'Big-box shopper',
  situation:'A whole-house window project. The homeowner had a big-box home improvement store\'s installation program out last week.',
  homeowner:'The big-box store quoted quite a bit less and they have a warranty too. They\'re a huge company — they\'re not going anywhere. Why would I pay more for a local outfit?',
  hiddenContext:'The big-box quote is for a different window series. The homeowner does not know who would actually be installing, and has not asked. She values "not going anywhere" because a small contractor once closed shop on her parents.',
  followUps:['They\'re a huge company. They\'re not going anywhere.','Their installer is certified too. It said so on the paperwork.'],
  coachKey:{
    objective:'Address the stability concern honestly and reframe the comparison around product, installer, and who is accountable — without bashing the big-box store.',
    strongBehaviors:['Acknowledges the appeal of a big-brand safety net','Asks what window series and who does the actual install on their quote','Compares apples to apples on product','Explains what local accountability actually looks like — who she calls, who shows up','Asks a question about the parents\' experience if it surfaces','Asks for the business'],
    weakBehaviors:['Sneering at the big-box store','Ignoring the "not going anywhere" concern','Assuming her quote is the same product','Overclaiming about your own company\'s longevity or guarantees','No close'],
    approach:'"Fair question — and I get why a national name feels safe. Two things I\'d want to know if I were you: is it the same window, and who physically installs it and answers the phone after?" Compare honestly. Address stability with what is true about your company. Ask for the decision.'
  } },
{ id:'cb-500', category:'Competitor Battle', value:500, scope:['Roofing'], difficulty:5, persona:'Conflicted homeowner',
  situation:'A full roof replacement. The family is hosting a wedding-weekend gathering at the house in about four months. Early on the homeowner mentioned that a "family friend" built their deck last year — and that it took three months longer than promised.',
  homeowner:'I\'ll be honest with you, we already know who we\'re probably going to use. A friend of the family does roofing. We just wanted a second opinion.',
  hiddenContext:'The "friend" is the same person who dragged out the deck. The homeowner is nervous about the wedding timing but feels obligated and afraid of hurting feelings. Choosing you means an awkward conversation with a friend. That social cost is the real objection.',
  followUps:['He\'s a family friend. It\'s... complicated.','Honestly — what would you do in my shoes?'],
  coachKey:{
    objective:'Recognize the social obligation as the real barrier, connect the deck experience to the wedding deadline without attacking the friend, and help the homeowner give themselves permission to choose based on the outcome they need.',
    strongBehaviors:['Respects the friendship openly — never attacks the friend','Asks what the second opinion was meant to confirm','Gently connects the deck timeline to the wedding timeline and asks how they feel about it','Helps them separate the relationship from the project decision','Offers a way to make the conversation with the friend easier (a professional reason, not a personal one)','Asks for the decision'],
    weakBehaviors:['Criticizing the friend\'s work or character','Ignoring the wedding deadline','Accepting "we already know" and leaving','Pushing so hard that loyalty kicks in','Not asking what "second opinion" means to them'],
    approach:'"I respect that — it\'s hard to go outside a friend. Can I ask what you wanted the second opinion to tell you?" Listen. "You mentioned the deck ran three months long. With the wedding four months out, how are you feeling about that?" Let them answer. Then help them frame the decision as protecting the event, and ask for it.'
  } },

/* ===================== TECHNICAL CONFIDENCE ===================== */
{ id:'tc-100', category:'Technical Confidence', value:100, scope:['Gutters','Roofing'], difficulty:1, persona:'Practical homeowner',
  situation:'You are presenting a roof replacement and have recommended replacing the gutters at the same time. The existing gutters are original, sagging in two places, and overflowing at the corners in your photos.',
  homeowner:'Do I really need new gutters? They\'re not falling off the house.',
  hiddenContext:'He has a damp corner in the basement that he has never connected to the overflowing gutter above it.',
  followUps:['They\'re not falling off. What does a gutter even do for the roof?','Can we just do the roof and see how the gutters hold up?'],
  coachKey:{
    objective:'Explain what gutters actually protect — foundation, fascia, siding, landscaping — clearly and briefly, using his photos, and connect to any water issues he has.',
    strongBehaviors:['Acknowledges that they are still attached — a fair point','Asks about any water in the basement or around the foundation','Explains gutter function in one or two plain sentences','Uses his overflow photos','Makes a clear recommendation and asks for a decision on scope'],
    weakBehaviors:['Vague "you should really do it" with no reason','Over-technical explanation','Pressuring him into an add-on he does not understand','Backing off instantly when challenged','No connection to his house'],
    approach:'"Fair — they\'re on the house. Quick question: any dampness in the basement, especially on this side?" Then: "Here\'s the corner in your photo overflowing — that water is going straight down to your foundation." Recommend, and ask whether he wants them done together.'
  } },
{ id:'tc-200', category:'Technical Confidence', value:200, scope:['Roofing'], difficulty:2, persona:'Cost-conscious homeowner',
  situation:'The homeowner\'s roof has a single layer of shingles. You have recommended a full tear-off.',
  homeowner:'What\'s wrong with just putting another layer of shingles over this? My last house had that done and it was fine for fifteen years. It\'s a lot cheaper.',
  hiddenContext:'Your inspection found a soft area near the rear valley that suggests decking damage. An overlay would cover it without fixing it.',
  followUps:['My last roofer did that and it was fine for fifteen years.','It\'s a lot cheaper. That\'s a big deal to me.'],
  coachKey:{
    objective:'Explain tear-off vs. overlay in plain, honest language without exaggerating, and tie the recommendation to the specific finding on this roof.',
    strongBehaviors:['Acknowledges that overlays exist and cost less','Explains what a tear-off lets you see and fix that an overlay hides','Points to the soft spot from the inspection as the specific reason here','Talks about weight, heat, and future removal cost honestly and briefly','Asks if that makes the recommendation make sense, then closes'],
    weakBehaviors:['Saying overlays are "illegal" or "never done" without knowing','Dismissing his previous experience','Overstating the risks','Getting into code minutiae','No close'],
    approach:'"They do exist, and yes, they\'re cheaper up front. Here\'s why I\'m not recommending it for your roof specifically." Show the soft spot. Explain what the tear-off allows. "Would you rather know what\'s under there, or cover it?" Then ask for the decision.'
  } },
{ id:'tc-300', category:'Technical Confidence', value:300, scope:['Siding'], difficulty:3, persona:'Practical homeowner',
  situation:'The north side of the house has visibly warped and faded siding. The other three sides look "okay" from the street. You have recommended full replacement.',
  homeowner:'Why do I need to replace all of it? Only the north side looks bad. Can\'t you just match that one side? Doing the whole house is twice the money.',
  hiddenContext:'The existing siding product is discontinued; the color has faded unevenly; and the inspection found soft sheathing at two window corners on the "good" east side.',
  followUps:['Can\'t you just match it?','That\'s twice the cost for three sides that look fine.'],
  coachKey:{
    objective:'Explain honestly why partial replacement is a poor fit here — matching, fading, and the hidden findings on the "good" sides — without dismissing a reasonable question.',
    strongBehaviors:['Agrees that the north side is clearly the worst','Explains the matching / discontinued / fade reality in plain language','Shows the east-side window corner findings','Offers an honest view of what one-side replacement would look like in two years','Asks for a decision on scope'],
    weakBehaviors:['Refusing to consider partial without explaining','Making up claims about products','Ignoring the money concern','Talking in installer jargon','No close'],
    approach:'"You\'re right that the north side is the worst. Two problems with just doing that side…" Explain matching and fade. Then show the east-side findings. "Given that, do you want a house that looks like one house, or one side that\'s new?" Ask for the decision.'
  } },
{ id:'tc-400', category:'Technical Confidence', value:400, scope:['Roofing'], difficulty:4, persona:'Engineer',
  situation:'The homeowner is a mechanical engineer. He has a notepad. He has asked about every component and wants specifics. You have presented the roof system.',
  homeowner:'I\'m an engineer. I want the exact details. What ice and water product, how far up the slope does it go, what\'s your ventilation calculation, and what happens if you find bad decking? Who decides that and what does it cost?',
  hiddenContext:'He respects people who say "I don\'t know, but I will get you the exact answer." He has caught two previous salespeople bluffing and dismissed both.',
  followUps:['That\'s not a number. That\'s marketing.','What happens if you find bad decking? Who decides, and what does it cost me?'],
  coachKey:{
    objective:'Answer clearly and honestly at a salesperson-appropriate level, never bluff, commit to getting exact specs where needed, and stay in control of the appointment.',
    strongBehaviors:['Welcomes the questions rather than getting rattled','Answers what he knows plainly and specifically','Says "I will confirm the exact spec" for anything he is not certain of — and writes it down','Explains the decking process honestly: how it is identified, communicated, and priced','Asks what else he needs to be confident, then asks for the decision'],
    weakBehaviors:['Bluffing or making up numbers','Getting defensive about "marketing"','Drowning him in sales language','Promising outcomes the company cannot guarantee','Losing the close in the technical weeds'],
    approach:'"Good — I\'d rather you ask now than wonder later." Answer directly. Where exact numbers are needed: "I\'m not going to guess at that — I\'ll get you the exact spec sheet." Explain the decking protocol clearly. Then: "What else do you need in writing to be comfortable moving forward?"'
  } },
{ id:'tc-500', category:'Technical Confidence', value:500, scope:['Roofing'], difficulty:5, persona:'Homeowner afraid of being oversold',
  situation:'You recommended ventilation improvements with the roof replacement. Earlier the homeowner mentioned frost on the attic nails last winter, a musty smell up there, and an ice dam over the front door. Another contractor was out yesterday.',
  homeowner:'The other guy said my attic ventilation is fine and that you\'re just padding the job. How do I know who\'s telling the truth? You\'re the one who benefits if I add it.',
  hiddenContext:'The frost, smell, and ice dam are classic signs of a ventilation and air-sealing problem — signs he himself described. He is not really asking a technical question; he is asking how to trust a recommendation he cannot evaluate himself, from someone who profits from it.',
  followUps:['How do I know who\'s telling the truth?','You\'re the one who benefits if I add it.'],
  coachKey:{
    objective:'Address the conflict-of-interest concern directly and honestly, then let his own observations — not your claims — make the case. Teach him how to evaluate the recommendation rather than asking him to trust you.',
    strongBehaviors:['Acknowledges the conflict of interest openly — "you\'re right, I do benefit"','Does not call the other contractor wrong or dishonest','Returns to what he said: frost, smell, ice dam — asks what he thinks causes those','Explains ventilation in plain cause-and-effect terms','Offers a way for him to verify (his own photos, what to look for, a written explanation)','Asks whether he would rather address the cause or hope it goes away, and closes'],
    weakBehaviors:['Attacking the competitor','Over-technical lecture','Getting offended by "padding the job"','Dropping the ventilation to make the sale easier without explaining the consequence','Asking him to "just trust me"'],
    approach:'"That\'s a completely fair concern — I do benefit, so don\'t take my word for it. Take yours. You told me about frost on the nails, a musty smell, and an ice dam. What do you think is causing those?" Walk through cause and effect. Offer to put it in writing. Then ask which recommendation actually explains what he is seeing.'
  } },

/* ===================== FINANCING & BUDGET ===================== */
{ id:'fb-100', category:'Financing & Budget', value:100, scope:['Roofing'], difficulty:1, persona:'Cash buyer',
  situation:'You have presented the roof and begun to review payment options.',
  homeowner:'I don\'t want financing. I\'ve never financed anything in my life. I\'ll pay cash.',
  hiddenContext:'She has the money. She also assumes there is a big cash discount because "everyone gives one."',
  followUps:['I\'ve never financed anything in my life and I\'m not starting now.','So what\'s the cash discount?'],
  coachKey:{
    objective:'Respect a cash buyer without pushing financing, handle the cash-discount expectation honestly, and move to the close.',
    strongBehaviors:['Respects the choice immediately — no pushing','Confirms payment logistics simply','Handles the discount question honestly without inventing a policy','Keeps the conversation moving toward scheduling','Asks for the business'],
    weakBehaviors:['Continuing to pitch financing','Inventing a discount or a policy on the spot','Acting surprised or awkward about cash','Long explanation of payment programs she does not want','Forgetting to close'],
    approach:'"Perfect — that keeps it simple." Handle the discount question honestly per company policy (do not invent one). "Then the only question is scheduling. Let\'s get you a date."'
  } },
{ id:'fb-200', category:'Financing & Budget', value:200, scope:['Windows'], difficulty:2, persona:'Monthly-payment thinker',
  situation:'A whole-house window project. You have presented the investment and an illustrative monthly payment (hypothetical, for roleplay).',
  homeowner:'That monthly payment is more than I expected. I was hoping for something more like a car payment.',
  hiddenContext:'His current heating bills are high and he has mentioned that the family room is unusable in winter. He has not connected the monthly cost to those things. He also has a "car payment" in mind because his car loan ends in six months.',
  followUps:['I was hoping for something more like a car payment.','Could we just do fewer windows to get the payment down?'],
  coachKey:{
    objective:'Understand where the expectation comes from, connect the monthly picture to what he is already spending and living with, and explore scope options honestly if needed.',
    strongBehaviors:['Acknowledges the payment surprise','Asks what payment would feel comfortable and why that number','Connects the payment to heating costs and the unusable room he mentioned','Discusses phasing honestly if it makes sense — without under-solving the problem','Does not quote or promise specific terms; keeps financing illustrative','Asks for a decision on scope and next step'],
    weakBehaviors:['Immediately cutting windows to hit a number','Quoting specific APRs or terms as fact','Ignoring his energy and comfort comments','Pressuring past the budget','No close'],
    approach:'"Got it — what number were you picturing, and what makes that the right number?" Then: "You mentioned the heating bills and the family room. What is that costing you now, in dollars and in use of the house?" Explore honestly whether phasing makes sense, and ask for a decision.'
  } },
{ id:'fb-300', category:'Financing & Budget', value:300, scope:['Roofing'], difficulty:3, persona:'Retired couple on a fixed income',
  situation:'A retired couple on a fixed income. Roof is near end of life with active moss and lifted shingles. They have been very kind and very quiet about money.',
  homeowner:'We weren\'t planning to spend anywhere near that. We\'re on a fixed income. Maybe we should just do it in a couple of years.',
  hiddenContext:'They have savings but consider it "emergency money." They do not know what a roof would do to their monthly picture and are embarrassed to ask. Their son has offered to help but they have not told him about the roof.',
  followUps:['We\'re on a fixed income. Things are tighter than they used to be.','Maybe we should just do it in a couple of years when things settle down.'],
  coachKey:{
    objective:'Have a dignified, honest conversation about affordability. Discover what resources exist and what waiting actually costs, without pressure and without inventing financing terms.',
    strongBehaviors:['Slows down; warm and respectful tone','Asks what they had been planning to spend, and how they had pictured paying for it','Gently explores whether waiting is a plan or a hope — what happens to a roof like this in two years','Asks whether family is involved in decisions like this, if appropriate','Presents options as information, clearly marked as illustrative','Asks what they would like to do next'],
    weakBehaviors:['Pressure of any kind','Quoting specific financing terms or approvals','Talking down to them','Ignoring the emotional weight of money','Leaving without a next step because it felt awkward'],
    approach:'"I appreciate you being straight with me. Can I ask — what had you pictured this costing, and how were you thinking of handling it?" Listen. Discuss what waiting realistically means for this roof. Offer to look at options together as information only. Ask how they would like to proceed.'
  } },
{ id:'fb-400', category:'Financing & Budget', value:400, scope:['Roofing'], difficulty:4, persona:'Young cash-saving homeowners',
  situation:'A young couple. The roof has soft spots and two active leak points. They want to save and pay cash next year.',
  homeowner:'We\'d rather save up and pay cash next year. My dad always says never finance home repairs, and honestly that makes sense to us.',
  hiddenContext:'The roof will not comfortably make it another year without more damage to decking and interior. Their real hesitation is a belief that financing equals irresponsibility, absorbed from a parent. They have not calculated what a year of damage costs versus what they would save.',
  followUps:['My dad says never finance home repairs. He\'s pretty firm about that.','What happens to the price next year anyway?'],
  coachKey:{
    objective:'Respect the family value while helping them weigh cost of waiting honestly. Do not sell financing — help them make an informed decision about timing.',
    strongBehaviors:['Respects the dad\'s advice — many people share it','Asks what the plan is to keep the leaks from getting worse over the year','Explains honestly what continued leaking does to decking and interior — without exaggeration','Reframes the question from "finance vs. cash" to "what does waiting cost"','Presents options neutrally; does not quote specific terms or promise future pricing','Asks for a decision'],
    weakBehaviors:['Arguing with the dad','Predicting specific future price increases','Pushing financing hard','Ignoring the active leaks','Accepting "next year" without discussion'],
    approach:'"That\'s good advice for a lot of things, and I\'m not going to argue with your dad. Different question: the roof is leaking in two places today. What\'s the plan to keep that from getting worse for a year?" Discuss the realistic cost of waiting. Present options as information. Ask what they want to do.'
  } },
{ id:'fb-500', category:'Financing & Budget', value:500, scope:['Roofing','Siding'], difficulty:5, persona:'Overwhelmed homeowner',
  situation:'Storm damage has affected the roof and one side of the siding. During discovery the homeowner mentioned, almost in passing, that she was recently approved for a home equity line "for something else," and that she filed an insurance claim after the storm but never followed up because "the last claim was a nightmare."',
  homeowner:'It\'s just not in the budget. I don\'t know what else to tell you.',
  hiddenContext:'This is not a budget problem — it is an overwhelm problem. She has two possible paths (insurance follow-through, equity line) and does not know how to sequence them, so she is defaulting to "no." She needs someone to help her organize the decision, not close her.',
  followUps:['I don\'t want to touch the equity line. That was for something else.','The insurance thing was a nightmare last time. I can\'t deal with that again.'],
  coachKey:{
    objective:'Recognize overwhelm masquerading as a budget objection. Help her lay out the paths she already mentioned in a calm, organized way — without promising insurance outcomes or advising her on financial products.',
    strongBehaviors:['Slows down and acknowledges that this feels like a lot','Reflects back what she said earlier — the claim, the line of credit — without pushing either','Asks what made the last claim a nightmare, and what would make this one easier','Offers to help organize the sequence: what gets decided first, second, third','Does not promise insurance approval or advise on her equity line — presents information only','Asks for a decision on the next step, not the whole project'],
    weakBehaviors:['Treating "not in the budget" as a discount request','Promising the insurance claim will pay','Telling her what to do with her equity line','Adding more information to an already overwhelmed homeowner','Leaving because she said no'],
    approach:'"I hear you. Can I say something? It sounds less like a budget problem and more like there are three moving pieces and no clear order. Would it help to lay them out together?" Sequence: claim follow-through, then decision on the rest. Ask what she would like the first step to be.'
  } },

/* ===================== TRUST & COMPANY STORY ===================== */
{ id:'ts-100', category:'Trust & Company Story', value:100, scope:['Roofing','Siding'], difficulty:1, persona:'Straightforward homeowner',
  situation:'Early in the appointment, after introductions, the homeowner leans back and asks the simplest hard question there is.',
  homeowner:'So why should I use Oaks — or Graves, whichever you are — instead of anybody else? Everybody says they have the best crews.',
  hiddenContext:'He has heard the same pitch three times this month. He is testing whether you will give a canned answer.',
  followUps:['Everybody says they have the best crews.','What actually happens if something goes wrong after you\'re paid?'],
  coachKey:{
    objective:'Deliver a concise, authentic company story that answers the question in terms of what happens to the homeowner — and turn it back into discovery.',
    strongBehaviors:['Concise — under a minute','Talks about what the homeowner experiences, not slogans','Honest about how problems get handled','Turns it around: asks what matters most to him in a contractor','Confident without being boastful'],
    weakBehaviors:['Canned pitch with buzzwords','Claiming to be the best at everything','Inventing awards, guarantees, or statistics','Rambling for five minutes','Not asking a single question back'],
    approach:'Give a tight, human answer about how the company works with homeowners and stands behind the work. Then: "Can I ask what would make you feel good about a contractor? What\'s mattered before?" Build the appointment around his answer.'
  } },
{ id:'ts-200', category:'Trust & Company Story', value:200, scope:['Windows'], difficulty:2, persona:'Extremely skeptical homeowner',
  situation:'The homeowner has been curt since you arrived. As you begin discovery she stops you.',
  homeowner:'I\'m going to be blunt. I don\'t trust salespeople. You\'re going to say whatever gets me to sign. Just give me the facts.',
  hiddenContext:'She had a high-pressure in-home presentation last year that lasted three hours. She agreed to this appointment because the windows are genuinely failing, not because she wants to be sold.',
  followUps:['You\'re going to say whatever gets me to sign. That\'s your job.','Just give me the facts. No pitch.'],
  coachKey:{
    objective:'Lower the temperature by agreeing to her terms, then earn trust through behavior — asking, listening, and being direct — rather than by claiming to be trustworthy.',
    strongBehaviors:['Does not argue or get defensive','Agrees to keep it factual and asks how she prefers to run the appointment','Asks what happened before to make her feel this way','Asks direct discovery questions and gives direct answers','Sets a time expectation and keeps it','Closes with a clear, no-drama ask'],
    weakBehaviors:['Saying "I\'m not like other salespeople"','Getting visibly hurt or defensive','Launching into the company story to prove trustworthiness','Talking more to compensate','Backing off the close because she is skeptical'],
    approach:'"Fair. Facts it is. Can I ask what happened last time?" Listen. Then: "Here\'s how I\'d like to run this — I look at the windows, I ask you a few questions, I give you a straight number, and you decide. About 45 minutes. Work for you?"'
  } },
{ id:'ts-300', category:'Trust & Company Story', value:300, scope:['Windows'], difficulty:3, persona:'Previous bad-contractor victim',
  situation:'A window replacement. The homeowner\'s previous window company installed one unit that leaked from day one; the installer never came back and the office stopped returning calls.',
  homeowner:'I had a terrible contractor experience before. They said all the same things you\'re saying — great crews, great warranty, we stand behind our work. How do I know you\'re actually going to show up when there\'s a problem?',
  hiddenContext:'She wants specifics: who she calls, how fast someone responds, what happens if the first fix does not work. Vague reassurance will confirm her fear.',
  followUps:['They said all the same things you\'re saying.','How do I know you\'re actually going to show up?'],
  coachKey:{
    objective:'Acknowledge that words alone cannot prove anything, then describe the actual process for service issues in concrete, verifiable terms — only what is true.',
    strongBehaviors:['Sincere acknowledgment — asks what happened','Admits that every company says the same things, so words are not the proof','Describes the specific service process: who she calls, what happens, how it is documented','Offers ways to verify (references, reviews, written process)','Asks what would make her comfortable, then asks for the business'],
    weakBehaviors:['"We\'re different, trust me"','Trashing the old company','Inventing guarantees or response times','Skipping past the story to the pitch','No close'],
    approach:'"I\'m sorry that happened — what did it look like when it went wrong?" Listen. "You\'re right that everyone says the same things. So instead of telling you, let me show you what actually happens when a customer calls us with a problem." Be specific and truthful. Then ask what else she needs to feel comfortable.'
  } },
{ id:'ts-400', category:'Trust & Company Story', value:400, scope:['Roofing'], difficulty:4, persona:'Analytical skeptic',
  situation:'You have just finished the company story. The homeowner, an analytical type, has been listening with arms crossed.',
  homeowner:'That sounds like marketing. Every company says they\'re family-owned, they care, they have great crews. Show me something I can actually verify.',
  hiddenContext:'He will respond to specifics he can check — documentation, process, references, how disputes are handled. He will not respond to adjectives.',
  followUps:['Every company says they\'re family-owned and they care.','Show me something I can verify.'],
  coachKey:{
    objective:'Agree that the story sounds like marketing, and replace adjectives with verifiable specifics and a way for him to check them himself.',
    strongBehaviors:['Agrees rather than defending the story','Offers concrete, checkable items — process documentation, references, reviews, how issues are handled — without inventing any','Asks what kind of proof would matter most to him','Keeps it brief and factual','Asks for the decision, or for a defined follow-up after he verifies'],
    weakBehaviors:['Repeating the story louder','Fabricating awards, ratings, or statistics','Getting defensive','Skipping the ask because he is tough','Long-winded answer'],
    approach:'"You\'re right — it does sound like marketing. Let me give you things you can check." List what is real and verifiable. "Which of those matters most to you? I\'ll get it in your hands." Then: "If those check out, what else stands between us and a start date?"'
  } },
{ id:'ts-500', category:'Trust & Company Story', value:500, scope:['Roofing'], difficulty:5, persona:'Polite homeowner hiding a concern',
  situation:'The appointment has gone very well: engaged homeowners, good questions, agreement on scope. Halfway through, one of them glanced at their phone for a long moment and became noticeably quieter. You ask for the business.',
  homeowner:'We\'d like to think about it. It\'s not you — it\'s just a big decision.',

  followUps:['It\'s not about you, honestly. It\'s just a lot of money.','(If asked) Do you... get a lot of complaints? I saw a review.'],
  coachKey:{

    strongBehaviors:['Notices and names the shift kindly: "It felt like something changed about halfway through — did I miss something?"','Creates space rather than pressure','When the review surfaces, does not get defensive or dismissive','Responds honestly about how the company handles complaints, without claiming perfection','Asks whether that resolves the concern and asks for the decision'],
    weakBehaviors:['Accepting "think about it" without probing','Repeating the presentation','Getting defensive about a review','Disparaging the reviewer','Claiming zero complaints ever'],
    approach:'"Of course. Can I ask something? About halfway through it felt like the energy shifted — did something come up?" If the review surfaces: "I appreciate you telling me. Here\'s honestly how we handle it when a customer isn\'t happy…" Then: "Does that change how you feel about moving forward?"'
  } },

    objective:'Explain honestly why the install and the product are connected — measurement, fit, warranty, accountability — without dismissing his idea.',

    approach:'"Good question — let\'s look at what you found." Check sizes. "Here\'s the issue: your openings aren\'t standard sizes, and here\'s what happens when a window doesn\'t fit exactly…" Then explain single-point accountability, and ask for the decision.'

{ id:'sm-300', category:'Scope Match', value:300, scope:['Gutters'], difficulty:3, persona:'Practical homeowner',

{ id:'sm-400', category:'Scope Match', value:400, scope:['Siding'], difficulty:4, persona:'Landlord',
  situation:'A rental property. The landlord owns three other properties and is meeting you at the unit between tenant turnovers. The siding is failing and there is water staining inside.',

    strongBehaviors:['Speaks his language: cost of ownership, turnover, callbacks','Asks about tenant complaints and vacancy — connects the water staining to it','Distinguishes "cheap" from "cost-effective" with specifics','Handles the "other properties" carrot professionally without discounting on a promise','Asks for the decision on this property'],

{ id:'sm-500', category:'Scope Match', value:500, scope:['Roofing','Windows','Siding'], difficulty:5, persona:'Long-term homeowner',
  situation:'The homeowner plans to stay in the house at least twenty years and called about the roof. During the inspection you found water intrusion behind the siding at two window corners, and the "roof leak" stains inside are directly below those windows, not below any roof defect. He mentioned he has repaired the same drywall twice.',
  homeowner:'Let\'s just do the roof. The siding and the windows can wait — one project at a time.',
  hiddenContext:'The roof does need replacement — but the leaks he blames on the roof are almost certainly from the window flashing and siding. If he only does the roof, the leak will continue and he will believe the new roof failed. The rep has to deliver an unwelcome, honest finding and reframe the scope.',
  followUps:['One project at a time. That\'s how I do things.','Are you sure the roof isn\'t the cause? It leaks when it rains.'],
  coachKey:{
    objective:'Deliver an honest, unwelcome diagnosis clearly, connect it to his goal (twenty years, stop repairing drywall), and help him re-sequence the projects rather than simply upselling.',
    strongBehaviors:['Respects "one project at a time" as a reasonable approach','Shows the evidence: stains below windows, intrusion at corners, no roof defect above','Explains honestly what happens if only the roof is done — and what he will conclude when it still leaks','Reframes around his stated twenty-year plan and the repeated drywall repairs','Offers sequencing options honestly (what must be done together, what can wait)','Asks for a decision on the right first project'],
    weakBehaviors:['Taking the roof order and staying quiet','Pushing all three projects with no prioritization','Being vague about the diagnosis','Ignoring his "one at a time" principle','No close'],
    approach:'"I agree with one at a time — I just want to make sure we do the right one first. Look at where these stains are." Show the evidence. "If we replace the roof and this keeps leaking, you\'re going to think we failed — and you\'d be right to. Here\'s what I\'d sequence for a twenty-year house…" Ask for the decision.'
  } },

/* ===================== CURVEBALL CUSTOMER ===================== */
{ id:'cc-100', category:'Curveball Customer', value:100, scope:['Roofing'], difficulty:1, persona:'Talkative homeowner',
  situation:'Forty-five minutes into the appointment. You have not been on the roof yet. The homeowner has told you about her grandchildren, her previous house, her brother\'s move to Buffalo, and her opinion of the new grocery store.',
  homeowner:'...and that\'s how my brother ended up in Buffalo, of all places. Anyway — where were we? Oh! That reminds me of another story about the last roofer...',

  coachKey:{
