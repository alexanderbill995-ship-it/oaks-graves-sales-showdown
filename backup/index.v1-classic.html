<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Showdown — Oaks / Graves Exterior Sales Battle</title>
<style>
/* =====================================================================
   SALES SHOWDOWN — Oaks Roofing & Siding + Graves Bros Home Improvements
   Single-file, offline, vanilla HTML/CSS/JS game-show sales trainer.
   ===================================================================== */
:root{
  --bg:#060b16; --bg2:#0a1428; --bg3:#0d1a33;
  --panel:#0f1d3a; --panel2:#132449; --panel3:#182d57;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --green:#23a75d; --green2:#177a41; --green-glow:rgba(35,167,93,.45);
  --amber:#ea9330; --amber2:#b86d17; --amber-glow:rgba(234,147,48,.45);
  --gold:#f4c65a; --gold2:#cf9d2c; --gold3:#8d6a17;
  --white:#f5f8fc; --muted:#9db0cf; --muted2:#6d7f9e;
  --red:#e04b4d; --blue:#3b7bff;
  --radius:16px; --radius-sm:10px;
  --shadow:0 14px 44px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.35);
  --font:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --display:"Arial Black","Segoe UI Black","Helvetica Neue",Impact,Arial,sans-serif;
  --hdr-h:58px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font); color:var(--white); background:var(--bg);
  background-image:
    radial-gradient(1200px 700px at 12% -10%, rgba(35,167,93,.16), transparent 60%),
    radial-gradient(1000px 600px at 100% 110%, rgba(234,147,48,.13), transparent 60%),
    linear-gradient(180deg,#081120 0%, #060b16 100%);
  overflow:hidden; display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold)}
.hidden{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
::selection{background:rgba(244,198,90,.35)}

/* ---------- Header ---------- */
#header{
  height:var(--hdr-h); flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:0 20px; background:linear-gradient(180deg,rgba(15,29,58,.95),rgba(9,18,38,.95));
  border-bottom:1px solid var(--line2); box-shadow:0 4px 24px rgba(0,0,0,.4); z-index:20; gap:16px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0;white-space:nowrap}
.brand-oaks,.brand-graves{font-family:var(--display);font-size:17px;letter-spacing:.14em}
.brand-oaks{color:var(--green)} .brand-graves{color:var(--amber)}
.brand-sep{color:var(--muted2);font-weight:300;font-size:22px;line-height:1;margin:0 -4px}
.brand-title{font-family:var(--display);font-size:16px;letter-spacing:.2em;color:var(--white);padding-left:14px;border-left:1px solid var(--line2);margin-left:6px}
.brand-session{color:var(--muted);font-size:13px;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;max-width:260px;padding-left:14px;border-left:1px solid var(--line2)}
.hdr-nav{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.hdr-btn{
  background:transparent;border:1px solid transparent;color:var(--muted);border-radius:8px;
  padding:7px 11px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  transition:all .15s ease; display:inline-flex;align-items:center;gap:6px;
}
.hdr-btn:hover{color:var(--white);background:rgba(255,255,255,.06);border-color:var(--line)}
.hdr-btn.active{color:var(--white);background:rgba(35,167,93,.16);border-color:rgba(35,167,93,.4)}
.hdr-btn.warn{color:var(--gold)}
.hdr-btn:disabled{opacity:.35;cursor:not-allowed}
.hdr-btn .ico{font-size:14px;line-height:1}
.hdr-divider{width:1px;height:22px;background:var(--line2);margin:0 6px}

/* ---------- Layout ---------- */
#app{flex:1 1 auto;min-height:0;position:relative}
.view{position:absolute;inset:0;padding:20px 30px 22px;overflow:auto;animation:viewIn .28s ease}
.view.fit{overflow:hidden;display:flex;flex-direction:column}
.view.no-anim{animation:none}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.container{max-width:1500px;margin:0 auto;width:100%}
.row{display:flex;gap:14px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{justify-content:space-between}
.center{justify-content:center}
.col{display:flex;flex-direction:column;gap:12px}
.grow{flex:1 1 auto;min-width:0}
.gap-s{gap:8px}.gap-l{gap:22px}
.mt{margin-top:14px}.mt-l{margin-top:26px}.mb{margin-bottom:14px}
.tc{text-align:center}.tr{text-align:right}
.muted{color:var(--muted)} .muted2{color:var(--muted2)}
.small{font-size:13px}
.nowrap{white-space:nowrap}

/* ---------- Typography ---------- */
.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);font-weight:700}
.eyebrow.green{color:var(--green)} .eyebrow.amber{color:var(--amber)} .eyebrow.gold{color:var(--gold)}
.display{font-family:var(--display);letter-spacing:.04em;line-height:1;text-transform:uppercase}
h1,h2,h3{margin:0;font-weight:800}
.page-title{font-family:var(--display);font-size:clamp(26px,3vw,40px);letter-spacing:.06em;text-transform:uppercase;line-height:1}
.page-title span{color:var(--gold)}
.gold-text{background:linear-gradient(180deg,#fff0bf 0%,var(--gold) 45%,var(--gold2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.green-text{color:var(--green)} .amber-text{color:var(--amber)} .red-text{color:var(--red)}

/* ---------- Panels ---------- */
.panel{
  background:linear-gradient(180deg,rgba(19,36,73,.92),rgba(13,26,51,.94));
  border:1px solid var(--line2); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px;
}
.panel.tight{padding:12px 14px}
.panel.glass{background:rgba(255,255,255,.035)}
.panel-title{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:14px;color:var(--muted);margin-bottom:10px}
.divider{height:1px;background:var(--line);margin:14px 0}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;
  padding:11px 20px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:13px;
  border:1px solid var(--line2);background:linear-gradient(180deg,var(--panel3),var(--panel2));color:var(--white);
  transition:transform .12s ease, box-shadow .15s ease, filter .15s ease, background .15s; white-space:nowrap;
  box-shadow:0 4px 14px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.08);
}
.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.1)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.4)}
.btn-primary{background:linear-gradient(180deg,#2cbb6b,#1a8a4a);border-color:rgba(255,255,255,.2);box-shadow:0 6px 22px var(--green-glow), inset 0 1px 0 rgba(255,255,255,.2)}
.btn-amber{background:linear-gradient(180deg,#f2a141,#c8781a);border-color:rgba(255,255,255,.2);box-shadow:0 6px 22px var(--amber-glow), inset 0 1px 0 rgba(255,255,255,.2);color:#1a1005}
.btn-gold{background:linear-gradient(180deg,#ffdf8a,#d9a533);border-color:rgba(255,255,255,.25);color:#2a1d05;box-shadow:0 6px 22px rgba(244,198,90,.35), inset 0 1px 0 rgba(255,255,255,.4)}
.btn-danger{background:linear-gradient(180deg,#e25a5c,#a92d2f);border-color:rgba(255,255,255,.15)}
.btn-ghost{background:transparent;box-shadow:none;border-color:var(--line2);color:var(--muted)}
.btn-ghost:hover:not(:disabled){color:var(--white);background:rgba(255,255,255,.05)}
.btn-lg{padding:15px 30px;font-size:16px;border-radius:14px}
.btn-xl{padding:20px 40px;font-size:20px;border-radius:16px;letter-spacing:.16em}
.btn-sm{padding:7px 12px;font-size:11px;border-radius:9px}
.btn-block{width:100%}
.btn .kbd{margin-left:4px}
.kbd{display:inline-block;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--muted);background:rgba(0,0,0,.25);letter-spacing:0;text-transform:none}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.label{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
.input,.select,.textarea{
  background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;color:var(--white);
  font-size:15px;width:100%;transition:border-color .15s;
}
.input:focus,.select:focus,.textarea:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px rgba(35,167,93,.2)}
.select option{background:#0f1d3a}
.textarea{min-height:80px;resize:vertical;line-height:1.45}
.check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;font-size:15px}
.check input{width:18px;height:18px;accent-color:var(--green)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:rgba(0,0,0,.25)}
.seg button{background:transparent;border:0;padding:10px 16px;font-weight:700;letter-spacing:.08em;color:var(--muted);font-size:13px;text-transform:uppercase;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:linear-gradient(180deg,#2cbb6b,#1a8a4a);color:#fff}
.seg.amber button.on{background:linear-gradient(180deg,#f2a141,#c8781a);color:#1a1005}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .track{width:46px;height:26px;border-radius:13px;background:rgba(255,255,255,.15);position:relative;transition:background .2s;border:1px solid var(--line2)}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked + .track{background:var(--green)}
.switch input:checked + .track::after{transform:translateX(20px)}
.switch input:focus-visible + .track{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- Chips / tags / misc ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--muted)}
.chip.green{border-color:rgba(35,167,93,.5);color:#62d692;background:rgba(35,167,93,.12)}
.chip.amber{border-color:rgba(234,147,48,.5);color:#ffb86a;background:rgba(234,147,48,.12)}
.chip.gold{border-color:rgba(244,198,90,.5);color:var(--gold);background:rgba(244,198,90,.12)}
.chip.red{border-color:rgba(224,75,77,.5);color:#ff8a8c;background:rgba(224,75,77,.12)}
.chip.blue{border-color:rgba(59,123,255,.5);color:#8fb3ff;background:rgba(59,123,255,.12)}
.chip.off{opacity:.5}
.chip.clickable{cursor:pointer}
.chip.clickable:hover{filter:brightness(1.15)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--display);font-size:30px;line-height:1}
.stat .k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.table{width:100%;border-collapse:collapse;font-size:15px}
.table th{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line2);font-weight:700}
.table td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:hover td{background:rgba(255,255,255,.03)}
.table .num{text-align:right;font-variant-numeric:tabular-nums}
.table th.num{text-align:right}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--radius)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line2);margin-bottom:16px}
.tab{background:transparent;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 16px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:13px;margin-bottom:-1px}
.tab.on{color:var(--white);border-bottom-color:var(--gold)}
.avatar{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-size:14px;letter-spacing:.02em;color:#fff;flex:0 0 auto;background:linear-gradient(135deg,var(--green),var(--green2));box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.avatar.b{background:linear-gradient(135deg,var(--amber),var(--amber2))}
.avatar.lg{width:64px;height:64px;font-size:24px}

/* ---------- Banner / toasts ---------- */
.banner{background:linear-gradient(90deg,#8a5a12,#b8791c);color:#fff;padding:8px 20px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:30}
.banner button{background:rgba(0,0,0,.25);border:0;color:#fff;border-radius:6px;padding:4px 10px;font-weight:700}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:100;pointer-events:none}
.toast{background:rgba(15,29,58,.96);border:1px solid var(--line2);border-left:4px solid var(--green);border-radius:10px;padding:11px 16px;box-shadow:var(--shadow);font-size:14px;font-weight:600;animation:toastIn .25s ease both;max-width:420px}
.toast.warn{border-left-color:var(--amber)} .toast.err{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

/* ---------- Modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(3,7,16,.78);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:90;animation:fadeIn .2s ease both;padding:20px}
.modal{background:linear-gradient(180deg,#152850,#0f1d3a);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);width:min(720px,96vw);max-height:92vh;overflow:auto;padding:26px 28px;animation:popIn .25s cubic-bezier(.2,.9,.3,1.2) both}
.modal.wide{width:min(1000px,96vw)}
.modal.narrow{width:min(480px,96vw)}
.modal h2{font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;font-size:22px;margin-bottom:8px}
.modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}

/* ---------- HOME ---------- */
.home{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:28px;height:100%}
.home-logo{display:flex;flex-direction:column;align-items:center;gap:12px}
.home-brands{display:flex;align-items:center;gap:18px;font-family:var(--display);letter-spacing:.3em;font-size:clamp(14px,1.4vw,20px)}
.home-brands .o{color:var(--green)} .home-brands .g{color:var(--amber)}
.home-brands .plus{color:var(--muted2);font-weight:300}
.home-title{font-family:var(--display);font-size:clamp(64px,9vw,130px);line-height:.92;letter-spacing:.02em;text-transform:uppercase;text-shadow:0 10px 40px rgba(0,0,0,.6)}
.home-title .l1{display:block;color:var(--white)}
.home-title .l2{display:block}
.home-sub{color:var(--muted);letter-spacing:.32em;text-transform:uppercase;font-size:clamp(12px,1.1vw,16px);font-weight:700}
.home-actions{display:grid;grid-template-columns:repeat(2,minmax(240px,300px));gap:14px;margin-top:6px}
.home-actions .btn-xl{grid-column:1/-1}
.home-links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.home-status{color:var(--muted);font-size:14px}
.home-status b{color:var(--white)}
.ribbon{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--green) 0 50%,var(--amber) 50% 100%);opacity:.8}

/* ---------- SETUP ---------- */
.setup-grid{display:grid;grid-template-columns:1.2fr .9fr;gap:20px;align-items:start}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.participant{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.2);cursor:pointer;user-select:none}
.participant.off{opacity:.45}
.participant input{accent-color:var(--green);width:17px;height:17px}
.participant .nm{font-weight:700}
.participant .mk{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.cat-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.cat-pick .participant{padding:7px 10px;font-size:14px}

/* ---------- WHEEL ---------- */
.wheel-layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.85fr);gap:26px;flex:1;min-height:0;align-items:center}
.wheel-stage{position:relative;display:flex;align-items:center;justify-content:center;height:100%;min-height:0}
.wheel-wrap{position:relative;width:min(78vh,46vw,760px);aspect-ratio:1;filter:drop-shadow(0 20px 50px rgba(0,0,0,.6))}
.wheel-wrap canvas{width:100%;height:100%;display:block;border-radius:50%}
.wheel-ring{position:absolute;inset:-10px;border-radius:50%;border:6px solid #1e2f5a;box-shadow:0 0 0 3px rgba(244,198,90,.55), inset 0 0 40px rgba(0,0,0,.6), 0 0 60px rgba(35,167,93,.15);pointer-events:none}
.wheel-ring::before{content:"";position:absolute;inset:-12px;border-radius:50%;background:repeating-conic-gradient(from 0deg, rgba(244,198,90,.9) 0 2deg, transparent 2deg 15deg);mask:radial-gradient(circle,transparent 0 calc(50% - 10px),#000 calc(50% - 9px));-webkit-mask:radial-gradient(circle,transparent 0 calc(50% - 10px),#000 calc(50% - 9px));opacity:.7}
.wheel-pointer{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:44px solid var(--gold);filter:drop-shadow(0 6px 8px rgba(0,0,0,.6));z-index:3}
.wheel-pointer::after{content:"";position:absolute;top:-48px;left:-14px;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c9,var(--gold2));box-shadow:0 3px 8px rgba(0,0,0,.5)}
.spin-btn{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:22%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#2fd077,#136b39 70%,#0d4b28);border:5px solid #f4e4b0;color:#fff;
  font-family:var(--display);font-size:clamp(16px,2vw,30px);letter-spacing:.14em;
  box-shadow:0 0 0 6px #0b1730, 0 10px 30px rgba(0,0,0,.7), 0 0 40px var(--green-glow);z-index:4;transition:transform .15s,filter .15s;
}
.spin-btn:hover:not(:disabled){transform:translate(-50%,-50%) scale(1.05);filter:brightness(1.1)}
.spin-btn:disabled{filter:grayscale(.5) brightness(.7);cursor:not-allowed}
.spin-btn.amber{background:radial-gradient(circle at 35% 30%,#ffb35c,#b0620f 70%,#7a4308);box-shadow:0 0 0 6px #0b1730, 0 10px 30px rgba(0,0,0,.7), 0 0 40px var(--amber-glow)}
.wheel-side{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto;padding-right:4px}
.contender{position:relative;border-radius:var(--radius);padding:16px 20px;border:1px solid var(--line2);background:linear-gradient(180deg,rgba(19,36,73,.9),rgba(13,26,51,.95));min-height:104px;display:flex;align-items:center;gap:16px;overflow:hidden}
.contender.a{border-color:rgba(35,167,93,.5)} .contender.b{border-color:rgba(234,147,48,.5)}
.contender .slot{font-family:var(--display);font-size:clamp(22px,2.6vw,38px);letter-spacing:.03em;text-transform:uppercase;line-height:1}
.contender .slot.empty{color:var(--muted2);font-size:20px;letter-spacing:.2em}
.contender .lbl{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:6px}
.contender.a .lbl{color:var(--green)} .contender.b .lbl{color:var(--amber)}
.contender .meta{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.06em}
.contender.reveal .slot{animation:nameHit .6s cubic-bezier(.2,1.2,.3,1) both}
@keyframes nameHit{0%{transform:scale(.6);opacity:0;filter:blur(6px)}60%{transform:scale(1.08);opacity:1;filter:blur(0)}100%{transform:scale(1)}}
.contender .shine{position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.12) 50%,transparent 70%);transform:translateX(-120%);pointer-events:none}
.contender.reveal .shine{animation:shine 1.1s ease .2s both}
@keyframes shine{to{transform:translateX(120%)}}
.vs-block{display:flex;align-items:center;justify-content:center;gap:16px;padding:6px 0}
.vs-badge{font-family:var(--display);font-size:clamp(28px,3.4vw,50px);letter-spacing:.06em;line-height:1;background:linear-gradient(180deg,#fff0bf,var(--gold) 50%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 14px rgba(244,198,90,.35))}
.vs-block.hit .vs-badge{animation:vsHit .7s cubic-bezier(.2,1.4,.3,1) both}
@keyframes vsHit{0%{transform:scale(3) rotate(-12deg);opacity:0}60%{transform:scale(.95) rotate(2deg);opacity:1}100%{transform:none}}
.vs-line{flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6}
.matchup-note{text-align:center;color:var(--muted);font-size:14px;letter-spacing:.06em}
.matchup-note b{color:var(--gold)}
.wheel-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wheel-actions .btn-lg{grid-column:1/-1}
.spin-status{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);white-space:nowrap}

/* VS overlay */
.vs-overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,rgba(9,18,38,.92),rgba(3,7,16,.97));animation:fadeIn .25s ease both}
.vs-overlay .names{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:40px;width:min(1500px,94vw)}
.vs-overlay .nm{font-family:var(--display);font-size:clamp(46px,7.5vw,120px);line-height:.95;text-transform:uppercase;letter-spacing:.01em;text-shadow:0 12px 40px rgba(0,0,0,.7)}
.vs-overlay .nm.a{text-align:right;color:#fff;animation:slideA .7s cubic-bezier(.2,1,.3,1) both}
.vs-overlay .nm.b{text-align:left;color:#fff;animation:slideB .7s cubic-bezier(.2,1,.3,1) both}
.vs-overlay .nm small{display:block;font-size:.34em;letter-spacing:.3em;margin-bottom:8px}
.vs-overlay .nm.a small{color:var(--green)} .vs-overlay .nm.b small{color:var(--amber)}
.vs-overlay .big-vs{font-family:var(--display);font-size:clamp(70px,11vw,170px);line-height:1;background:linear-gradient(180deg,#fff0bf,var(--gold) 50%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(244,198,90,.45));animation:vsHit .8s cubic-bezier(.2,1.4,.3,1) .35s both}
.vs-overlay .sub{position:absolute;bottom:10vh;left:0;right:0;text-align:center;color:var(--muted);letter-spacing:.3em;text-transform:uppercase;font-weight:800;animation:fadeIn .5s ease 1s both}
@keyframes slideA{from{transform:translateX(-60vw);opacity:0}to{transform:none;opacity:1}}
@keyframes slideB{from{transform:translateX(60vw);opacity:0}to{transform:none;opacity:1}}

/* ---------- BOARD ---------- */
.matchbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:10px 18px;border-radius:var(--radius);border:1px solid var(--line2);background:linear-gradient(180deg,rgba(19,36,73,.9),rgba(13,26,51,.95));box-shadow:var(--shadow);flex:0 0 auto}
.mb-rep{display:flex;align-items:center;gap:14px;min-width:0}
.mb-rep.b{flex-direction:row-reverse;text-align:right}
.mb-rep .nm{font-family:var(--display);font-size:clamp(18px,2vw,28px);text-transform:uppercase;letter-spacing:.02em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb-rep .pts{font-family:var(--display);font-size:clamp(22px,2.4vw,34px);color:var(--gold);line-height:1}
.mb-rep .sub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:4px;display:flex;gap:8px;align-items:center}
.mb-rep.b .sub{justify-content:flex-end}
.mb-rep .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mb-rep.b .tags{justify-content:flex-end}
.mb-center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:200px}
.mb-center .rnd{font-family:var(--display);letter-spacing:.2em;font-size:15px;color:var(--white)}
.mb-center .fmt{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.pips{display:flex;gap:6px}
.pip{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);background:rgba(0,0,0,.3)}
.pip.a{background:var(--green);border-color:var(--green)} .pip.b{background:var(--amber);border-color:var(--amber)}
.mb-rep .avatar.lg{box-shadow:0 0 0 3px rgba(255,255,255,.08)}
.mb-rep.control .avatar{box-shadow:0 0 0 3px var(--gold), 0 0 24px rgba(244,198,90,.5)}
.board-wrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;margin-top:12px}
.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:auto repeat(5,1fr);gap:clamp(6px,.7vw,12px)}
.board .cat{
  display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 8px;min-height:64px;border-radius:12px;
  background:linear-gradient(180deg,#1b3a6b,#12284e);border:1px solid rgba(255,255,255,.14);border-top:3px solid var(--green);
  font-family:var(--display);font-size:clamp(12px,1.25vw,20px);letter-spacing:.06em;text-transform:uppercase;line-height:1.15;box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 6px 16px rgba(0,0,0,.35)
}
.board .cat:nth-child(even){border-top-color:var(--amber)}
.tile{
  position:relative;border-radius:12px;border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(180deg,#183466,#0f234a);color:var(--gold);font-family:var(--display);
  font-size:clamp(26px,4.6vh,64px);letter-spacing:.02em;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1), inset 0 -18px 30px rgba(0,0,0,.25), 0 8px 20px rgba(0,0,0,.4);
  transition:transform .15s ease, box-shadow .2s ease, filter .2s; text-shadow:0 4px 12px rgba(0,0,0,.6); overflow:hidden;
}
.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.08),transparent 45%);pointer-events:none}
.tile:hover:not(:disabled){transform:translateY(-3px) scale(1.02);box-shadow:inset 0 1px 0 rgba(255,255,255,.15), 0 14px 30px rgba(0,0,0,.5), 0 0 0 2px rgba(244,198,90,.5);filter:brightness(1.12)}
.tile:disabled{cursor:default}
.tile.used{background:linear-gradient(180deg,#0b162c,#081124);color:rgba(255,255,255,.12);text-shadow:none;border-color:rgba(255,255,255,.05);box-shadow:none}
.tile.used::after{content:attr(data-winner);position:absolute;bottom:8px;left:0;right:0;font-family:var(--font);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted2);text-align:center;font-weight:700}
.tile.opening{animation:tileFlip .8s cubic-bezier(.4,0,.2,1) both;z-index:5}
@keyframes tileFlip{0%{transform:scale(1)}30%{transform:scale(1.08) rotateX(0)}100%{transform:scale(1.15) rotateX(90deg);opacity:0}}
.tile.locked{filter:saturate(.5) brightness(.7)}
.board-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex:0 0 auto;flex-wrap:wrap}
.board-foot .hint{color:var(--muted);font-size:14px;letter-spacing:.04em}
.board-foot .hint b{color:var(--gold)}
.control-flag{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:rgba(244,198,90,.12);border:1px solid rgba(244,198,90,.5);color:var(--gold);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
.board-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,11,22,.7);backdrop-filter:blur(3px);z-index:6;border-radius:var(--radius)}

/* Double Down overlay */
.dd-overlay{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle at center,rgba(90,50,5,.85),rgba(3,7,16,.97));animation:fadeIn .2s ease both}
.dd-overlay .dd-title{font-family:var(--display);text-transform:uppercase;font-size:clamp(70px,12vw,180px);line-height:.9;letter-spacing:.02em;background:linear-gradient(180deg,#fff2c4,var(--gold) 40%,#c77a12);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 40px rgba(244,198,90,.5));animation:ddPulse 1.6s ease-in-out infinite, vsHit .7s cubic-bezier(.2,1.4,.3,1) both}
.dd-overlay .dd-val{font-family:var(--display);font-size:clamp(40px,6vw,90px);color:#fff;letter-spacing:.06em;animation:fadeIn .5s ease .5s both}
.dd-overlay .dd-val s{color:var(--muted2);margin-right:20px;font-size:.6em}
.dd-overlay .dd-sub{letter-spacing:.34em;text-transform:uppercase;font-weight:800;color:var(--gold);animation:fadeIn .5s ease .3s both}
@keyframes ddPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

/* ---------- BATTLE / ROLEPLAY ---------- */
.battle-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.42fr);gap:16px;flex:1;min-height:0;margin-top:12px}
.prompt-card{position:relative;display:flex;flex-direction:column;gap:14px;padding:clamp(16px,2.2vh,28px) clamp(20px,2.6vw,40px);min-height:0;overflow:auto}
.prompt-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.prompt-head .cat{font-family:var(--display);font-size:clamp(18px,2vw,30px);letter-spacing:.1em;text-transform:uppercase}
.prompt-head .val{font-family:var(--display);font-size:clamp(24px,2.6vw,40px);color:var(--gold);line-height:1}
.prompt-head .val.dd{background:linear-gradient(180deg,#fff2c4,var(--gold) 40%,#c77a12);-webkit-background-clip:text;background-clip:text;color:transparent}
.situation{font-size:clamp(15px,1.5vw,20px);line-height:1.5;color:#d6def0;border-left:3px solid var(--green);padding:6px 0 6px 16px}
.homeowner{background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.2));border:1px solid var(--line2);border-radius:14px;padding:clamp(14px,2vh,24px) clamp(18px,2.4vw,32px);position:relative}
.homeowner .q{font-size:clamp(20px,2.3vw,36px);line-height:1.32;font-weight:600;color:#fff;font-style:italic}
.homeowner .q::before{content:"\201C";color:var(--gold);font-family:Georgia,serif;font-size:1.6em;line-height:0;vertical-align:-.35em;margin-right:4px;font-style:normal}
.homeowner .q::after{content:"\201D";color:var(--gold);font-family:Georgia,serif;font-size:1.6em;line-height:0;vertical-align:-.35em;margin-left:4px;font-style:normal}
.homeowner.push{border-color:rgba(234,147,48,.6);background:linear-gradient(180deg,rgba(234,147,48,.16),rgba(0,0,0,.25));animation:pushIn .5s cubic-bezier(.2,1.2,.3,1) both}
.homeowner.push .q{font-size:clamp(18px,2vw,30px)}
@keyframes pushIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.pushbacks{display:flex;flex-direction:column;gap:10px}
.mod-notes{border:1px dashed rgba(255,255,255,.2);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--muted);line-height:1.45}
.mod-notes b{color:var(--amber);letter-spacing:.14em;text-transform:uppercase;font-size:11px;display:block;margin-bottom:4px}
.rail{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.responder{border-radius:var(--radius);padding:14px 18px;border:1px solid var(--line2);background:linear-gradient(180deg,rgba(19,36,73,.9),rgba(13,26,51,.95));display:flex;align-items:center;gap:14px}
.responder.a{border-color:rgba(35,167,93,.55);box-shadow:0 0 0 1px rgba(35,167,93,.25), 0 10px 30px rgba(35,167,93,.12)}
.responder.b{border-color:rgba(234,147,48,.55);box-shadow:0 0 0 1px rgba(234,147,48,.25), 0 10px 30px rgba(234,147,48,.12)}
.responder .lbl{font-size:11px;letter-spacing:.28em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.responder.a .lbl{color:var(--green)} .responder.b .lbl{color:var(--amber)}
.responder .nm{font-family:var(--display);font-size:clamp(20px,2vw,30px);text-transform:uppercase;line-height:1;margin-top:4px}
.responder .ord{margin-left:auto;text-align:right;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700}
.order-strip{display:flex;gap:8px;align-items:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.order-strip .who{padding:5px 10px;border-radius:8px;border:1px solid var(--line2);background:rgba(0,0,0,.25);color:var(--white)}
.order-strip .who.done{opacity:.45;text-decoration:line-through}
.order-strip .who.now{border-color:var(--gold);color:var(--gold)}
.timer-card{border-radius:var(--radius);padding:12px 18px 14px;border:1px solid var(--line2);background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.18));text-align:center;transition:background .3s,border-color .3s}
.timer-card .lbl{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);font-weight:800}
.timer-card .time{font-family:var(--display);font-size:clamp(56px,7.5vh,96px);line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums;margin:4px 0 8px;transition:color .2s}
.timer-card.warn{border-color:rgba(244,198,90,.6)} .timer-card.warn .time{color:var(--gold)}
.timer-card.crit{border-color:rgba(224,75,77,.8);background:linear-gradient(180deg,rgba(224,75,77,.22),rgba(0,0,0,.25));animation:critPulse .5s ease-in-out infinite alternate}
.timer-card.crit .time{color:#ff7476}
.timer-card.done .time{color:var(--red)}
.timer-card.prep .time{color:#8fb3ff}
@keyframes critPulse{from{box-shadow:0 0 0 0 rgba(224,75,77,.0)}to{box-shadow:0 0 0 6px rgba(224,75,77,.25)}}
.timer-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:12px}
.timer-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7fe0a5);transition:width .2s linear}
.timer-card.warn .timer-bar i{background:linear-gradient(90deg,var(--gold2),var(--gold))}
.timer-card.crit .timer-bar i{background:linear-gradient(90deg,#a92d2f,var(--red))}
.timer-ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.timer-ctl .btn{padding:9px 6px;font-size:11px;letter-spacing:.08em}
.timer-ctl .btn.wide{grid-column:1/-1}
.mod-tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mod-tools .btn{padding:8px 8px;font-size:10.5px;letter-spacing:.06em}
.mod-tools .btn.wide{grid-column:1/-1}
details.mod{border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.2)}
details.mod summary{cursor:pointer;padding:9px 14px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:800;list-style:none;display:flex;justify-content:space-between}
details.mod summary::after{content:"+"} details.mod[open] summary::after{content:"−"}
details.mod .inner{padding:4px 12px 12px}
.reading-tip{font-size:12px;color:var(--muted);letter-spacing:.04em;text-align:center}

/* ---------- JUDGE ---------- */
.judge-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;flex:1;min-height:0;margin-top:12px}
.judge-col{border-radius:var(--radius);border:1px solid var(--line2);background:linear-gradient(180deg,rgba(19,36,73,.9),rgba(13,26,51,.95));display:flex;flex-direction:column;min-height:0;overflow:hidden;transition:box-shadow .3s,border-color .3s}
.judge-col.a{border-top:4px solid var(--green)} .judge-col.b{border-top:4px solid var(--amber)}
.judge-col.lead{box-shadow:0 0 0 2px var(--gold), 0 0 40px rgba(244,198,90,.25)}
.judge-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
.judge-head .nm{font-family:var(--display);font-size:clamp(20px,2.2vw,32px);text-transform:uppercase;line-height:1}
.judge-head .total{font-family:var(--display);font-size:clamp(30px,3.6vw,52px);line-height:1;color:var(--gold);transition:transform .2s}
.judge-head .total small{font-size:.45em;color:var(--muted)}
.judge-head .total.bump{animation:bump .3s ease}
@keyframes bump{50%{transform:scale(1.18)}}
.dims{display:flex;flex-direction:column;flex:1;justify-content:space-evenly;padding:6px 20px 10px;gap:4px;min-height:0;overflow:auto}
.dim{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.dim:last-child{border-bottom:0}
.dim .t{font-family:var(--display);letter-spacing:.14em;font-size:clamp(13px,1.2vw,17px);text-transform:uppercase}
.dim .d{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.score-btns{display:flex;gap:6px}
.score-btns button{width:clamp(38px,3.6vw,52px);height:clamp(38px,3.6vw,52px);border-radius:10px;border:1px solid var(--line2);background:rgba(0,0,0,.3);color:var(--muted);font-family:var(--display);font-size:clamp(16px,1.4vw,22px);transition:all .12s}
.score-btns button:hover{border-color:var(--gold);color:var(--white)}
.score-btns button.on{background:linear-gradient(180deg,#ffdf8a,#d9a533);color:#2a1d05;border-color:#fff3c9;box-shadow:0 4px 14px rgba(244,198,90,.4)}
.judge-col.a .score-btns button.on{background:linear-gradient(180deg,#2cbb6b,#1a8a4a);color:#fff;border-color:#9ff0c0}
.judge-col.b .score-btns button.on{background:linear-gradient(180deg,#f2a141,#c8781a);color:#1a1005;border-color:#ffd9ad}
.judge-foot{display:flex;flex-direction:column;gap:10px;margin-top:12px;flex:0 0 auto}
.judge-foot .row{flex-wrap:wrap}
.quick-judge{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch;flex:1;min-height:0;margin-top:12px}
.quick-judge .btn{font-size:clamp(20px,2.4vw,34px);border-radius:20px;flex-direction:column;gap:8px;white-space:normal;line-height:1.1}
.quick-judge .btn small{font-size:12px;letter-spacing:.3em;opacity:.8}

/* ---------- Coach key ---------- */
.coach-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.coach-box{border-radius:12px;padding:14px 16px;border:1px solid var(--line2);background:rgba(0,0,0,.25)}
.coach-box h4{margin:0 0 8px;font-family:var(--display);letter-spacing:.16em;font-size:12px;text-transform:uppercase;color:var(--muted)}
.coach-box.good h4{color:var(--green)} .coach-box.bad h4{color:var(--red)} .coach-box.obj h4{color:var(--gold)} .coach-box.app h4{color:#8fb3ff}
.coach-box ul{margin:0;padding-left:18px;line-height:1.5;font-size:14.5px}
.coach-box p{margin:0;line-height:1.5;font-size:15px}
.coach-box.full{grid-column:1/-1}

/* ---------- Sudden death ---------- */
.sd-hero{text-align:center;padding:10px 0 4px}
.sd-hero .t{font-family:var(--display);font-size:clamp(44px,6.5vw,92px);line-height:1;letter-spacing:.04em;background:linear-gradient(180deg,#ffb3b3,var(--red) 50%,#8f1d1f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(224,75,77,.4));animation:vsHit .7s cubic-bezier(.2,1.4,.3,1) both}
.sd-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.4fr);gap:16px;flex:1;min-height:0;margin-top:8px}

/* ---------- Match result ---------- */
.result{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;height:100%;text-align:center}
.result .crown{font-size:clamp(40px,6vh,72px);animation:crownDrop .9s cubic-bezier(.2,1.4,.3,1) both}
@keyframes crownDrop{from{transform:translateY(-80px) scale(.5);opacity:0}to{transform:none;opacity:1}}
.result .win-lbl{font-family:var(--display);letter-spacing:.5em;font-size:clamp(14px,1.6vw,22px);color:var(--gold);animation:fadeIn .5s ease .3s both}
.result .win-name{font-family:var(--display);font-size:clamp(60px,9vw,140px);line-height:.95;text-transform:uppercase;background:linear-gradient(180deg,#fff,#dfe7f5 60%,#a9b8d4);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 16px 40px rgba(0,0,0,.6));animation:nameHit .8s cubic-bezier(.2,1.2,.3,1) .2s both}
.result .win-sub{color:var(--muted);letter-spacing:.2em;text-transform:uppercase;font-weight:700;animation:fadeIn .5s ease .7s both}
.result-stats{display:grid;grid-template-columns:repeat(4,minmax(140px,180px));gap:12px;animation:fadeIn .5s ease .9s both}
.result-stats .panel{padding:14px 16px;text-align:center}
.result-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;animation:fadeIn .5s ease 1.1s both}
.scoreline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:22px;animation:fadeIn .5s ease .8s both}
.scoreline .s{font-family:var(--display);font-size:clamp(28px,3.6vw,54px);line-height:1}
.scoreline .s small{display:block;font-size:.34em;letter-spacing:.2em;color:var(--muted);margin-bottom:6px}
.scoreline .s.a{text-align:right;color:var(--green)} .scoreline .s.b{text-align:left;color:var(--amber)}
.scoreline .dash{color:var(--muted2);font-family:var(--display);font-size:30px}

/* ---------- Standings ---------- */
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:end;margin:8px 0 22px}
.pod{border-radius:var(--radius);border:1px solid var(--line2);background:linear-gradient(180deg,rgba(19,36,73,.9),rgba(13,26,51,.95));padding:18px 16px 16px;text-align:center;position:relative;overflow:hidden}
.pod .place{font-family:var(--display);font-size:13px;letter-spacing:.3em;color:var(--muted)}
.pod .nm{font-family:var(--display);font-size:clamp(20px,2.2vw,32px);text-transform:uppercase;margin:8px 0 6px;line-height:1}
.pod .st{display:flex;justify-content:center;gap:16px;color:var(--muted);font-size:13px}
.pod .st b{color:var(--white)}
.pod.p1{border-color:rgba(244,198,90,.7);box-shadow:0 0 40px rgba(244,198,90,.18);padding-top:28px}
.pod.p1 .place{color:var(--gold)} .pod.p1 .nm{color:var(--gold)}
.pod.p2{border-color:rgba(200,210,230,.5)} .pod.p2 .place{color:#cfd8ea}
.pod.p3{border-color:rgba(205,127,50,.6)} .pod.p3 .place{color:#e0a370}
.pod .medal{font-size:30px;line-height:1}
.pod.empty-pod{opacity:.35}
.rank{display:inline-flex;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;font-family:var(--display);font-size:13px;background:rgba(255,255,255,.08);color:var(--muted)}
.rank.r1{background:var(--gold);color:#2a1d05} .rank.r2{background:#cfd8ea;color:#1a2238} .rank.r3{background:#cd7f32;color:#2a1a05}

/* ---------- Roster / admin ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .input,.toolbar .select{width:auto;min-width:160px}
.toolbar .grow{flex:1}
.rep-row .nm{font-weight:800;font-size:16px}
.rep-row.inactive td{opacity:.5}
.pill-toggle{display:inline-flex;align-items:center;gap:8px;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);background:rgba(0,0,0,.25);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.pill-toggle.on{border-color:rgba(35,167,93,.6);color:#62d692}
.pill-toggle.off{color:var(--muted2)}
.q-group{margin-bottom:22px}
.q-group-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:12px;background:linear-gradient(180deg,#1b3a6b,#12284e);border:1px solid var(--line2);margin-bottom:8px}
.q-group-head h3{font-family:var(--display);letter-spacing:.14em;font-size:15px;text-transform:uppercase}
.q-item{display:grid;grid-template-columns:70px 1fr auto;gap:14px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.18);margin-bottom:6px}
.q-item.off{opacity:.5}
.q-item .val{font-family:var(--display);font-size:22px;color:var(--gold);text-align:center}
.q-item .txt{font-size:14.5px;line-height:1.4;color:#d6def0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.q-item .meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.q-item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cat-avg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.cat-avg .panel{padding:14px 16px}
.cat-avg .nm{font-family:var(--display);font-size:18px;text-transform:uppercase;margin-bottom:8px}
.cat-avg .line{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px solid var(--line)}
.cat-avg .line b{color:var(--gold)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7fe0a5)}

/* ---------- How to play ---------- */
.howto-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.4}
.steps li::before{content:counter(s);flex:0 0 30px;width:30px;height:30px;border-radius:50%;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#2a1d05;font-family:var(--display);display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.frame{display:grid;gap:8px}
.frame .f{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.2)}
.frame .f b{font-family:var(--display);letter-spacing:.14em;font-size:14px;text-transform:uppercase;color:var(--green)}
.frame .f span{font-size:14px;color:#d6def0;line-height:1.4}
.tips li{margin-bottom:6px;line-height:1.45;font-size:14.5px}
.shortcut-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.shortcut-grid div{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--muted)}
.shortcut-grid .kbd{font-size:12px;color:var(--white)}

/* ---------- Settings ---------- */
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;align-items:start}
.setting{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}
.setting .t{font-weight:700;font-size:15px}
.setting .d{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4}
.danger-zone{border-color:rgba(224,75,77,.4)}
.danger-zone .panel-title{color:#ff8a8c}

/* ---------- Recap ---------- */
.recap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.recap-grid .panel{text-align:center;padding:16px}
.recap-grid .k{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:800}
.recap-grid .v{font-family:var(--display);font-size:clamp(20px,2vw,30px);text-transform:uppercase;margin-top:8px;line-height:1.05}
.recap-grid .s{font-size:13px;color:var(--muted);margin-top:6px}

/* ---------- Confetti / overlays ---------- */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
.flash{position:fixed;inset:0;pointer-events:none;z-index:75;background:radial-gradient(circle,rgba(244,198,90,.35),transparent 70%);animation:flash .7s ease both}
@keyframes flash{from{opacity:1}to{opacity:0}}
.streak{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:linear-gradient(90deg,rgba(234,147,48,.25),rgba(224,75,77,.25));border:1px solid rgba(234,147,48,.6);color:#ffc98a;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800}
.countdown-big{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:65;pointer-events:none}
.countdown-big span{font-family:var(--display);font-size:clamp(120px,24vw,340px);color:#fff;text-shadow:0 0 60px rgba(59,123,255,.6);animation:cdPop .95s ease-out both}
@keyframes cdPop{0%{transform:scale(1.4);opacity:0}20%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}

/* ---------- Presentation mode ---------- */
body.presentation .hdr-nav .hdr-btn:not(.keep){display:none}
body.presentation .brand-session{display:none}
body.presentation #header{height:46px}
body.presentation .mod-tools,body.presentation details.mod,body.presentation .reading-tip,body.presentation .board-foot .adm{display:none}
body.presentation .view{padding:14px 26px 18px}
body.presentation .prompt-card .homeowner .q{font-size:clamp(24px,2.8vw,44px)}
body.presentation .tile{font-size:clamp(30px,5.4vh,76px)}

/* ---------- Footer hint ---------- */
.foot-hint{position:fixed;left:16px;bottom:10px;font-size:11px;color:var(--muted2);letter-spacing:.08em;z-index:15;display:none;gap:10px;align-items:center}
body.v-home .foot-hint,body.v-howto .foot-hint,body.v-settings .foot-hint{display:flex}
.foot-hint .kbd{font-size:10px}
body.presentation .foot-hint{display:none}

/* ---------- Print ---------- */
.print-only{display:none}
@media print{
  body{background:#fff;color:#000;overflow:visible;display:block}
  #header,#app,#toasts,#modalRoot,#confetti,.foot-hint,.banner{display:none !important}
  .print-only{display:block;padding:24px;font-family:Arial,Helvetica,sans-serif;color:#000}
  .print-only h1{font-size:26px;margin:0 0 4px}
  .print-only h2{font-size:16px;margin:22px 0 8px;border-bottom:2px solid #000;padding-bottom:4px;text-transform:uppercase;letter-spacing:.08em}
  .print-only table{width:100%;border-collapse:collapse;font-size:12px}
  .print-only th,.print-only td{border:1px solid #999;padding:5px 7px;text-align:left}
  .print-only .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .print-only .card{border:1px solid #999;padding:10px;border-radius:6px}
  .print-only .k{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#555}
  .print-only .v{font-size:16px;font-weight:800;margin-top:3px}
}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

/* ---------- Responsive ---------- */
@media (max-width:1400px){
  .brand-title{font-size:14px} .hdr-btn{padding:6px 9px;font-size:11px}
}
@media (max-width:1150px){
  .brand-title,.brand-session{display:none}
  .hdr-btn{padding:6px 7px;font-size:10px}
}

  .wheel-layout{grid-template-columns:minmax(0,1fr) minmax(320px,.9fr)}
  .setup-grid,.howto-grid{grid-template-columns:1fr}
  .result-stats{grid-template-columns:repeat(2,minmax(140px,200px))}
}
@media (max-height:800px){
  .view{padding:12px 22px 16px}
  .dim .d{display:none}
  .dim{padding:3px 0}
  .score-btns button{width:38px;height:36px;font-size:16px}
  .judge-head{padding:10px 18px}
  .judge-foot{margin-top:8px}
  .judge-foot .textarea{min-height:44px !important}
  .matchbar{padding:8px 16px}
  .mb-rep .avatar.lg{width:52px;height:52px;font-size:19px}
  .timer-card .time{font-size:clamp(46px,7vh,72px)}
  .homeowner .q{font-size:clamp(18px,2vw,28px)}
  .board .cat{min-height:52px;font-size:clamp(11px,1.15vw,17px);padding:6px}
}
